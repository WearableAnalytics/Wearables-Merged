# Local stack for the Wearables platform (no Kubernetes needed).
#
#   cd deploy/local
#   cp .env.example .env            # optional, defaults work out of the box
#   docker compose up -d --build              # core platform
#   docker compose --profile ml up -d --build # + Spark / LakeFS / SeaweedFS / MLflow / Feast
#
# Everything public goes through Traefik on http://localhost (same paths as production):
#   /           clinician frontend      /api      wearables-bff (+ /api/extraction)
#   /import     importservice (/import/ingest)    /proxy    grafana-proxy
#   Grafana admin: http://localhost:3003/proxy/
# See README.md in this folder for details.

name: wearables

x-jwt-env: &jwt-env
  JWT_SECRET: ${JWT_SECRET:-dev-secret}

x-influx-env: &influx-env
  INFLUX_URL: http://influxdb:8086
  INFLUX_ORG: ${INFLUX_ORG:-wearables-project}
  INFLUX_BUCKET: ${INFLUX_BUCKET:-measurements}
  INFLUX_TOKEN: ${INFLUX_TOKEN:-dev-influx-token}

# All Spark services share one image; each declares the build so `up --build` never tries to pull it.
x-spark-build: &spark-build
  context: ../../gitops/apps/ml-pipeline
  dockerfile: spark_jobs/Dockerfile

x-ml-env: &ml-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: wearables-lp
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wearables}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-wearables-secret}
  BRONZE_BUCKET: lake-bronze
  LAKEFS_ENDPOINT: http://lakefs:8000
  LAKEFS_ACCESS_KEY: ${LAKEFS_ACCESS_KEY:-AKIAIOSFOLKFSSAMPLES}
  LAKEFS_SECRET_KEY: ${LAKEFS_SECRET_KEY:-wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
  SILVER_LAKEFS_REPO: lake-silver
  SILVER_LAKEFS_BRANCH: processed
  INFLUX_CHECKPOINT_BRANCH: influx-checkpoint-branch
  INFLUX_URL: http://influxdb:8086
  INFLUX_TOKEN: ${INFLUX_TOKEN:-dev-influx-token}
  INFLUX_ORG: ${INFLUX_ORG:-wearables-project}
  INFLUX_BUCKET: ml_predictions
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-wearables}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-wearables-secret}
  MODEL_NAME: heart_rate_model
  MODEL_ALIAS: Production
  FEAST_DB_HOST: postgres
  FEAST_DB_PORT: "5432"
  FEAST_DB_NAME: feast
  FEAST_DB_USER: feast_user
  FEAST_DB_PASSWORD: feast

services:
  # ---------------------------------------------------------------- ingress
  traefik:
    image: traefik:v3.5
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --api.insecure=true
      - --api.dashboard=true
      - --entrypoints.traefik.address=:8080
    ports:
      - "80:80"
      - "8088:8080" # Traefik dashboard
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  # ---------------------------------------------------------------- streaming
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 8
    # No volume: Kafka is only a buffer here, measurements persist in InfluxDB.
    ports:
      - "29092:29092" # for kafka clients on the host
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    # The mapper's PARTITIONS env must match the partitions of wearables-raw.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in wearables-raw wearables-lp dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 8 --replication-factor 1
        done
    restart: "no"

  # ---------------------------------------------------------------- ingestion
  importservice:
    build: ../../services/backend/importservice
    environment:
      <<: *jwt-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: wearables-raw
      # Case tokens are issued by wearables-bff, so the issuer must match TOKEN_ISSUER there.
      JWT_ISSUER: wearables-bff
      UVICORN_WORKERS: 2
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  cloud-connector:
    build: ../../services/backend/cloud-connector
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: wearables-raw
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  fhir-mapper-validator:
    build: ../../services/backend/fhir-mapper-validator
    environment:
      KAFKA_BROKER_ENV_VAR: kafka:9092
      INPUT_TOPIC: wearables-raw
      OUTPUT_TOPIC: wearables-lp
      DLQ_TOPIC: dlq
      PARTITIONS: 8
      NUM_STREAM_THREADS: 2
      MAPPING_YAML_PATH: /config/mapping.yaml
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  telegraf:
    image: telegraf:1.36
    environment:
      <<: *influx-env
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------- storage
  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin-password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-wearables-project}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-measurements}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-influx-token}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Shared Postgres: db_lord (user/domain DB) + mlflow / feast / lakefs databases.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: db_lord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_lord"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------- data management / APIs
  db-lord:
    build: ../../services/backend/db_lord
    environment:
      <<: *influx-env
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: db_lord
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      WEB_CONCURRENCY: 2
    command: >
      sh -c "/app/.venv/bin/alembic upgrade head &&
             exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000" # REST + GraphQL docs at http://localhost:8000/docs
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  extraction-service:
    build: ../../services/backend/extraction-service
    environment:
      DB_LORD_BASE_URL: http://db-lord:8000
      # Served through the BFF at /api/extraction (Swagger at /api/extraction/docs).
      ROOT_PATH: /api/extraction
    depends_on:
      - db-lord

  wearables-bff:
    build: ../../services/backend/wearables-bff
    environment:
      <<: *jwt-env
      PORT: 3001
      NODE_ENV: development
      API_PREFIX: /api
      FRONTEND_ORIGINS: http://localhost
      FRONTEND_REDIRECT_URL: http://localhost
      BACKEND_URL: http://localhost
      AUTH_SESSION_EXPIRY_SECONDS: 604800
      MAGIC_LINK_EXPIRY_SECONDS: 900
      CASE_TOKEN_EXPIRY_SECONDS: 691200
      TOKEN_ISSUER: wearables-bff
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
      DATABASE_API_URL: http://db-lord:8000
      DATABASE_API_TIMEOUT: 30000
      EXTRACTION_API_URL: http://extraction-service:8010
      USE_MOCK_DATA: "false"
      LOG_LEVEL: debug
      # NODE_ENV=development -> no mail is sent, magic links are logged:
      #   docker compose logs -f wearables-bff | grep -i magic
      MAILER_FROM_NAME: Wearables Platform
      MAILER_FROM_EMAIL: dev@example.com
    depends_on:
      - db-lord
      - extraction-service

  # ---------------------------------------------------------------- frontend
  web:
    build: ../../services/web
    volumes:
      # The image's nginx.conf points at the in-cluster BFF; Traefik does the routing here.
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro

  # ---------------------------------------------------------------- dashboards
  grafana:
    image: grafana/grafana:12.3.2
    environment:
      # Embedded dashboards are served through grafana-proxy at /proxy, so Grafana's public
      # sub path must be /proxy too (otherwise its router shows "Page not found").
      GF_SERVER_ROOT_URL: http://localhost/proxy/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      INFLUX_TOKEN: ${INFLUX_TOKEN:-dev-influx-token}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-measurements}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/dashboards:/var/lib/grafana-dashboards:ro
    ports:
      - "3003:3000" # direct admin access: http://localhost:3003/proxy/ (admin / admin)
    depends_on:
      influxdb:
        condition: service_healthy

  # Generates the RSA key grafana-proxy signs its Grafana JWTs with (once, kept in a volume).
  grafana-proxy-keygen:
    image: node:20-alpine
    command:
      - node
      - -e
      - |
        const fs = require('fs'); const p = '/keys/grafana-jwt.pem';
        if (!fs.existsSync(p)) {
          const { privateKey } = require('crypto').generateKeyPairSync('rsa', {
            modulusLength: 2048, privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
            publicKeyEncoding: { type: 'spki', format: 'pem' } });
          fs.writeFileSync(p, privateKey); console.log('generated', p);
        }
    volumes:
      - grafana_proxy_keys:/keys
    restart: "no"

  grafana-proxy:
    build: ../../services/backend/grafana-proxy
    environment:
      PORT: 3002
      PROXY_PREFIX: /proxy
      GRAFANA_BASE_URL: http://grafana:3000
      GRAFANA_PATH_PREFIX: /proxy
      GRAFANA_JWT_PRIVATE_KEY_PATH: /keys/grafana-jwt.pem
      GRAFANA_JWT_HEADER: X-JWT-Assertion
      GRAFANA_JWT_ISSUER: wearables-grafana-proxy
      GRAFANA_JWT_AUDIENCE: grafana
      GRAFANA_ORG_ID: 1
      GRAFANA_ALLOWED_DASHBOARD_IDS: wearables-health-real,wearables-six-min,adgf864
      GRAFANA_DASHBOARD_DATASOURCE: dfa4opgnfgg00e # uid of the provisioned InfluxDB datasource
      APP_JWT_SECRET: ${JWT_SECRET:-dev-secret}
      APP_JWT_ISSUER: wearables-bff
    volumes:
      - grafana_proxy_keys:/keys:ro
    depends_on:
      grafana-proxy-keygen:
        condition: service_completed_successfully
      grafana:
        condition: service_started

  # ================================================================ ML pipeline (profile "ml")
  seaweedfs:
    profiles: [ml]
    image: chrislusf/seaweedfs:3.59
    # Keys live in seaweedfs/s3.json; keep them in sync with S3_ACCESS_KEY / S3_SECRET_KEY.
    # Small volumes: the 30 GB default leaves "no free volumes" on a laptop-sized Docker disk.
    command: >
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=256 -volume.max=100
    ports:
      - "8333:8333" # S3 API
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  seaweedfs-init:
    profiles: [ml]
    image: amazon/aws-cli:2.27.50
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-wearables}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-wearables-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1; do sleep 2; done
        for b in lake-bronze lake-silver lake-gold models; do
          aws --endpoint-url http://seaweedfs:8333 s3 mb "s3://$$b" 2>/dev/null || true
        done
        aws --endpoint-url http://seaweedfs:8333 s3 ls
    depends_on:
      - seaweedfs
    restart: "no"

  lakefs:
    profiles: [ml]
    image: treeverse/lakefs:1.74.4
    environment:
      LAKEFS_DATABASE_TYPE: postgres
      LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING: postgres://lakefs:lakefs@postgres:5432/lakefs?sslmode=disable
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: local-dev-lakefs-encrypt-key
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://seaweedfs:8333
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_DISCOVER_BUCKET_REGION: "false"
      LAKEFS_BLOCKSTORE_S3_REGION: us-east-1
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-wearables}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-wearables-secret}
    ports:
      - "8001:8000" # LakeFS UI
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully

  # Mirrors SCRIPTS/lakefs_setup/workflow-branch.yaml
  lakefs-init:
    profiles: [ml]
    image: treeverse/lakefs:1.74.4
    environment:
      LAKECTL_SERVER_ENDPOINT_URL: http://lakefs:8000
      LAKECTL_CREDENTIALS_ACCESS_KEY_ID: ${LAKEFS_ACCESS_KEY:-AKIAIOSFOLKFSSAMPLES}
      LAKECTL_CREDENTIALS_SECRET_ACCESS_KEY: ${LAKEFS_SECRET_KEY:-wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # First start only: create the admin user with fixed keys (fails harmlessly once set up).
        until wget -qO- http://lakefs:8000/_health >/dev/null 2>&1; do sleep 2; done
        wget -qO- --header 'Content-Type: application/json' --post-data \
          "{\"username\":\"admin\",\"key\":{\"access_key_id\":\"$$LAKECTL_CREDENTIALS_ACCESS_KEY_ID\",\"secret_access_key\":\"$$LAKECTL_CREDENTIALS_SECRET_ACCESS_KEY\"}}" \
          http://lakefs:8000/api/v1/setup_lakefs >/dev/null 2>&1 || true
        until lakectl repo list >/dev/null 2>&1; do sleep 2; done
        lakectl repo create lakefs://lake-silver s3://lake-silver/ --default-branch main || true
        lakectl branch create lakefs://lake-silver/processed --source lakefs://lake-silver/main || true
        lakectl branch create lakefs://lake-silver/influx-checkpoint-branch --source lakefs://lake-silver/main || true
        lakectl branch list lakefs://lake-silver
    depends_on:
      - lakefs
    restart: "no"

  influxdb-ml-init:
    profiles: [ml]
    image: influxdb:2.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        influx bucket create --host http://influxdb:8086 -t "${INFLUX_TOKEN:-dev-influx-token}"
        -o "${INFLUX_ORG:-wearables-project}" -n ml_predictions || true
    depends_on:
      influxdb:
        condition: service_healthy
    restart: "no"

  mlflow:
    profiles: [ml]
    build:
      context: ../../gitops/apps/ml-pipeline
      dockerfile: mlflow/Dockerfile
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-wearables}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-wearables-secret}
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=*
      - --backend-store-uri=postgresql://mlflow:mlflow@postgres:5432/mlflow
      - --default-artifact-root=s3://models/
      - --no-serve-artifacts
    ports:
      - "5001:5000" # MLflow UI + model registry (5000 is taken by AirPlay on macOS)
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully

  feast:
    profiles: [ml]
    build:
      context: ../../gitops/apps/ml-pipeline
      dockerfile: feast/Dockerfile
    environment:
      FEAST_DB_HOST: postgres
      FEAST_DB_PORT: "5432"
      FEAST_DB_NAME: feast
      FEAST_DB_USER: feast_user
      FEAST_DB_PASSWORD: feast
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        envsubst < /config/feature_store.yaml > feature_store.yaml
        feast apply && exec feast serve --host 0.0.0.0 --port 6566
    ports:
      - "6566:6566"
    volumes:
      - ./ml/feature_store.yaml:/config/feature_store.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: trains and registers heart_rate_model@Production (ml-dev/src/ml_flow_training.py).
  ml-train:
    profiles: [ml]
    image: wearables-local/streaming-ml-pipeline
    build: *spark-build
    environment:
      <<: *ml-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until python3 -c "import urllib.request; urllib.request.urlopen('http://mlflow:5000/health')" 2>/dev/null; do sleep 3; done
        exec python3 /opt/ml-dev/ml_flow_training.py
    volumes:
      - ../../gitops/apps/ml-pipeline/ml-dev/src:/opt/ml-dev:ro
    depends_on:
      mlflow:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    restart: "no"

  spark-raw-to-bronze:
    profiles: [ml]
    image: wearables-local/streaming-ml-pipeline
    build: *spark-build
    environment:
      <<: *ml-env
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g",
              "/opt/spark/work-dir/jobs/raw_to_bronze.py"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully
    restart: on-failure

  spark-bronze-to-silver:
    profiles: [ml]
    image: wearables-local/streaming-ml-pipeline
    build: *spark-build
    environment:
      <<: *ml-env
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g",
              "/opt/spark/work-dir/jobs/bronze_to_silver.py"]
    depends_on:
      spark-raw-to-bronze:
        condition: service_started
      lakefs-init:
        condition: service_completed_successfully
    # Fails until the bronze Delta table exists (first data arrived), then settles.
    restart: on-failure

  spark-silver-to-prediction:
    profiles: [ml]
    image: wearables-local/streaming-ml-pipeline
    build: *spark-build
    environment:
      <<: *ml-env
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g",
              "/opt/spark/work-dir/jobs/silver_to_prediction.py"]
    depends_on:
      spark-bronze-to-silver:
        condition: service_started
      influxdb-ml-init:
        condition: service_completed_successfully
      feast:
        condition: service_started
      ml-train:
        condition: service_completed_successfully
    # Fails until the silver table exists, then settles.
    restart: on-failure

volumes:
  influxdb_data:
  postgres_data:
  grafana_data:
  grafana_proxy_keys:
  seaweedfs_data:
