# Local copy of gitops/apps/monitoring/telegraf/templates/telegraf-config-map.yaml
[agent]
  interval = "100ms"
  metric_batch_size = 50000
  metric_buffer_limit = 500000
  flush_interval = "1s"
  flush_jitter = "0s"
  buffer_strategy = "memory"
  debug = false
  quiet = false
  # The container name as `host` tag would make re-sent readings separate series.
  omit_hostname = true

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["wearables-lp"]
  consumer_group = "metrics"
  max_message_len = 5000000
  consumer_fetch_default = "10MB"
  version = "4.1.0"
  data_format = "influx"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[processors.starlark]]
  source = '''
load("time.star", "time")
def apply(metric):
  metric.fields["t_ingested"] = time.now().unix_nano
  # The mapper writes the patient only as device-id-reference ("Patient/<id>");
  # dashboards and tools filter on device-id.
  ref = metric.tags.get("device-id-reference")
  if "device-id" not in metric.tags and ref and ref.startswith("Patient/"):
    metric.tags["device-id"] = ref[len("Patient/"):]
  return metric
'''
