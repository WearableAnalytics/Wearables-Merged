---
- name: Load kernel modules for K3s
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Make kernel modules persistent
  copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
      overlay

- name: Sysctl für K3s konfigurieren
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { key: 'net.ipv4.ip_forward', value: '1' }

- name: K3s installieren
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - \
      --write-kubeconfig-mode 600 \
      --disable traefik \
      --disable servicelb
  args:
    creates: /usr/local/bin/k3s

- name: Docker-Gruppe für kubectl erstellen
  group:
    name: docker
    state: present

- name: Warten bis K3s läuft
  wait_for:
    port: 6443
    delay: 5
    timeout: 300

- name: Kubeconfig für alle Sudo-User kopieren
  block:
    - name: .kube Verzeichnis erstellen
      file:
        path: "/home/{{ item.name }}/.kube"
        state: directory
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: '0755'
      when: item.sudo
      loop: "{{ users }}"

    - name: Kubeconfig kopieren
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ item.name }}/.kube/config"
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
        mode: '0600'
        remote_src: yes
      when: item.sudo
      loop: "{{ users }}"

- name: kubectl Alias für alle User
  lineinfile:
    path: "/home/{{ item.name }}/.bashrc"
    line: "alias k='kubectl'"
    create: yes
  loop: "{{ users }}"

- name: K3s Status anzeigen
  command: systemctl status k3s
  register: k3s_status
  changed_when: false

- name: K3s Info ausgeben
  debug:
    msg:
      - "K3s erfolgreich installiert!"
      - "Kubeconfig: /etc/rancher/k3s/k3s.yaml"
      - "kubectl ist verfügbar"
