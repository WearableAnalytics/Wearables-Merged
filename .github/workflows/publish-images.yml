name: Publish service images

# Builds db-lord, wearables-bff, extraction-service, importservice, mapper and web and
# publishes them to GitHub Container Registry (ghcr.io/wearableanalytics/<image>).
# - Pull requests: build only, to catch broken Dockerfiles early.
# - Pushes to main: build and publish, tagged with the commit SHA and `latest`.
# The images contain no secrets; those are injected by Kubernetes at runtime.

on:
  push:
    branches: [main]
    paths:
      - "services/backend/db_lord/**"
      - "services/backend/wearables-bff/**"
      - "services/backend/extraction-service/**"
      - "services/backend/importservice/**"
      - "services/backend/fhir-mapper-validator/**"
      - "services/web/**"
      - "gitops/apps/services/importservice/**"
      - "gitops/apps/services/mapper-validator/**"
      - "gitops/apps/platform/kafka/**"
      - ".github/workflows/publish-images.yml"
  pull_request:
    paths:
      - "services/backend/db_lord/**"
      - "services/backend/wearables-bff/**"
      - "services/backend/extraction-service/**"
      - "services/backend/importservice/**"
      - "services/backend/fhir-mapper-validator/**"
      - "services/web/**"
      - "gitops/apps/services/importservice/**"
      - "gitops/apps/services/mapper-validator/**"
      - "gitops/apps/platform/kafka/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ingestion-deployment:
    name: Ingestion deployment checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ingestion_test
          POSTGRES_USER: ingestion
          POSTGRES_PASSWORD: ingestion-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ingestion -d ingestion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INGEST_TEST_DATABASE_URL: postgresql://ingestion:ingestion-test-only@127.0.0.1:5432/ingestion_test
    defaults:
      run:
        working-directory: services/backend/importservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Install check dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio ruff pyyaml
      - name: Lint and verify deployment contracts with PostgreSQL
        run: |
          ruff check app tests
          pytest -q --ignore=tests/test_connected.py --ignore=tests/test_deployment_connected.py

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wearables-db-lord
            context: services/backend/db_lord
          - image: wearables-bff
            context: services/backend/wearables-bff
          - image: wearables-extraction-service
            context: services/backend/extraction-service
          - image: wearables-importservice
            context: services/backend/importservice
          - image: wearables-mapper-validator
            context: services/backend/fhir-mapper-validator
          - image: wearables-web
            context: services/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wearableanalytics/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # The images are public, so refuse to publish one that contains a secret.
      # (Vulnerability scanning stays in trivy-security-scan.yml.)
      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: scan/${{ matrix.image }}:ci
          scanners: secret
          exit-code: "1"
          format: table

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
