name: Grafana participant identity
on:
  pull_request:
    paths:
      - "observability/dashboards/**"
      - "observability/tests/**"
      - "gitops/apps/monitoring/telegraf/**"
      - ".github/workflows/grafana-identity.yml"
  push:
    branches: [main, stage/ws2627]
    paths:
      - "observability/dashboards/**"
      - "observability/tests/**"
      - "gitops/apps/monitoring/telegraf/**"
      - ".github/workflows/grafana-identity.yml"
permissions:
  contents: read
jobs:
  identity:
    name: Grafana queries with rendered Telegraf and InfluxDB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - run: python -m pip install pytest pyyaml httpx
      - name: Verify participant isolation and source filters for current and legacy points
        env:
          GRAFANA_IDENTITY_TEST: "1"
        run: pytest -q observability/tests/test_dashboard_identity.py
