name: Continuous Delivery & GitOps Verification

# Validates and lints Helm charts on pull requests to main, deploys updated charts to the de.NBI cluster upon push to main

on:
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - ".github/workflows/cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "gitops/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      target_service:
        description: "Specific service chart to deploy (e.g. cloud-connector, or 'all')"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  lint-charts:
    name: Lint & Validate Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint all Helm charts
        run: |
          echo "=== Linting all platform charts ==="
          FAILED=0
          for chart in $(find gitops/apps -name "Chart.yaml" -exec dirname {} \;); do
            echo "--> Linting chart: $chart"
            helm lint "$chart" || FAILED=1
          done
          if [ $FAILED -ne 0 ]; then
            echo "::error::One or more Helm charts failed linting."
            exit 1
          fi
          echo "All Helm charts successfully validated!"

  deploy:
    name: Deploy to de.NBI Cluster
    needs: lint-charts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure Kubeconfig
        id: kubeconfig
        run: |
          if [ -n "${{ secrets.KUBECONFIG }}" ]; then
            mkdir -p $HOME/.kube
            echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
            chmod 600 $HOME/.kube/config
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "Kubeconfig successfully configured."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::No KUBECONFIG secret found. GitOps pull-mode (ArgoCD) will sync changes in-cluster."
          fi

      - name: Deploy Cloud Connector (Push-mode fallback)
        if: steps.kubeconfig.outputs.configured == 'true'
        run: |
          echo "=== Deploying cloud-connector via Helm ==="
          helm upgrade --install cloud-connector gitops/apps/services/cloud-connector \
            -f gitops/apps/services/cloud-connector/values.yaml \
            --namespace cloud-connector \
            --create-namespace \
            --wait \
            --timeout 5m
