name: Mobile App Automated Builds (Android & iOS)

on:
  push:
    branches:
      - main
      - stage/ws2627
    paths:
      - "services/mobile/mobile_app/**"
      - ".github/workflows/mobile-build.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mobile/mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests
        run: flutter test --no-pub

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (for Google Play Store)
        run: flutter build appbundle --release

      - name: Determine artifact names
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/stage/ws2627" ]; then
            CHANNEL="stage"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CHANNEL="main"
          else
            CHANNEL="${{ github.ref_name }}"
          fi
          SAFE_CHANNEL=$(echo "$CHANNEL" | tr '/' '-')
          echo "channel=$SAFE_CHANNEL" >> $GITHUB_OUTPUT
          echo "apk_filename=charite-wearables-${SAFE_CHANNEL}.apk" >> $GITHUB_OUTPUT
          echo "aab_filename=charite-wearables-${SAFE_CHANNEL}.aab" >> $GITHUB_OUTPUT

      - name: Prepare named build outputs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${{ steps.meta.outputs.apk_filename }}"
          cp build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/${{ steps.meta.outputs.aab_filename }}"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: charite-wearables-${{ steps.meta.outputs.channel }}-apk
          path: services/mobile/mobile_app/build/app/outputs/flutter-apk/${{ steps.meta.outputs.apk_filename }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: charite-wearables-${{ steps.meta.outputs.channel }}-bundle
          path: services/mobile/mobile_app/build/app/outputs/bundle/release/${{ steps.meta.outputs.aab_filename }}
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS (Xcode Compilation & Verification)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: services/mobile/mobile_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Determine channel
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/stage/ws2627" ]; then
            CHANNEL="stage"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CHANNEL="main"
          else
            CHANNEL="${{ github.ref_name }}"
          fi
          SAFE_CHANNEL=$(echo "$CHANNEL" | tr '/' '-')
          echo "channel=$SAFE_CHANNEL" >> $GITHUB_OUTPUT

      - name: Compress iOS App bundle
        run: |
          cd build/ios/iphoneos
          zip -r "../../../charite-wearables-${{ steps.meta.outputs.channel }}-ios-unsigned.zip" Runner.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: charite-wearables-${{ steps.meta.outputs.channel }}-ios-unsigned
          path: services/mobile/mobile_app/charite-wearables-${{ steps.meta.outputs.channel }}-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine release tag and title
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/stage/ws2627" ]; then
            TAG="app-stage"
            TITLE="Wearables Mobile App (Stage)"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="app-main"
            TITLE="Wearables Mobile App (Main)"
          else
            SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
            TAG="app-${SAFE_REF}"
            TITLE="Wearables Mobile App (${SAFE_REF})"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: true
          make_latest: false
          body: |
            Automated mobile build for branch `${{ github.ref_name }}` (${{ github.sha }}).
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
            release-artifacts/*.zip
