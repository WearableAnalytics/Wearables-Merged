services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wearables-postgres
    environment:
      POSTGRES_DB: db_lord
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # db_lord - FastAPI Backend
  db_lord:
    build:
      context: ./services/backend/db_lord
      dockerfile: Dockerfile
    container_name: wearables-db-lord
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: db_lord
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      # InfluxDB optional - uncomment if needed
      # INFLUX_URL: http://influxdb:8086
      # INFLUX_ORG: my-org
      # INFLUX_BUCKET: medical_data
      # INFLUX_TOKEN: your_token
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Registration Service - Node.js
  registration-service:
    build:
      context: ./services/backend/registration-service-node
      dockerfile: Dockerfile
    container_name: wearables-registration
    environment:
      PORT: 3001
      API_PREFIX: /api
      DATABASE_API_URL: http://db_lord:8080
      USE_MOCK_DATA: false
      JWT_SECRET: dev-secret-key-change-in-production
      FRONTEND_URL: http://localhost:8080
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      - db_lord
    restart: unless-stopped

  # Web Frontend - React/Vite
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3001/api
        VITE_GRAFANA_IFRAME_URL: /grafana/
    container_name: wearables-web
    ports:
      - "8080:80"
    depends_on:
      - registration-service
    restart: unless-stopped

volumes:
  postgres_data:
