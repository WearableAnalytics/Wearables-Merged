[models.apple_watch]
source = "calibrated: aggregate timings and type inventory profiled from the Person B export (native Apple Watch, model Watch7). Values are medians/quantiles only"
kind = "watch"
platform = "healthkit"
archetype = "native"
source_name = "Apple Watch"
hardware = "Watch7,1"
available_from = "2023-09-22"
features = ["wrist_temperature", "breathing_disturbances", "running_dynamics", "physical_effort", "effort_score", "daylight", "afib_history", "stairs", "ecg"]
features_since = { breathing_disturbances = "2024-09-16", physical_effort = "2023-09-18", effort_score = "2024-09-16", daylight = "2023-09-18" }
writes_rmssd = false
charging_every_days = 1.0
charge_minutes = [55.0, 0.4]
charge_hour = [7.5, 2.5]               # mean, sd local hour
auto_detect_workouts = true
step_bias = [0.97, 0.05]               # per-device multiplicative bias, mean and sd (assumption: Apple Watch free-living MAPE ~6%, mild underestimate)

[models.apple_watch.signal]
source = "assumption: Apple Watch HR is more accurate than the shared defaults (published wrist-sensor validations); not measured on the exports, which have no reference ECG"
noise_multiplier = 1.5
motion_penalty = 0.30
cadence_lock_probability = 0.03
hr_motion_error_fraction = 0.03
hr_outlier_probability = 0.004
hr_outlier_sigma = 8.0
spo2_bias = 0.0
spo2_error_sigma = 2.0                 # Apple Watch 7 SpO2 MAE ~2.2 in a mixed clinical sample
hrv_bias = -0.12                       # Apple SDNN reads ~8 ms low vs Polar H10 (O'Grady et al. 2024, https://doi.org/10.3390/s24196220)
hrv_error_sigma = 0.30                 # MAPE ~29% in the same study

[models.apple_watch.metrics]
source = "calibrated: Person B export inter-sample and duration quantiles; HR cadence = 2-component lognormal mixtures fitted per context on the fit window before 2026-07-01 (aggregate timing only)"
heart_rate = { mode = "samples", cadence = { workout = [[0.795, 4.99, 0.41], [0.205, 5.82, 2.2]], sleep = [[0.72, 213.0, 0.55], [0.28, 12.0, 1.33]], still = [[0.578, 220.0, 0.65], [0.422, 5.0, 0.82]], moving = [[0.698, 5.0, 0.41], [0.302, 13.5, 2.25]] }, quality = true }
steps = { mode = "chunks", chunk_all = [300.0, 1.6, 600.0], bridge_seconds = 240.0, active_only = true }
distance_walking_running = { mode = "chunks", chunk = { workout = [5.0, 0.5, 15.0], moving = [90.0, 1.4, 600.0], still = [60.0, 1.4, 600.0], sleep = [60.0, 1.0, 600.0] }, active_only = true, bridge_seconds = 120.0 }
distance_cycling = { mode = "chunks", chunk = { workout = [1.0, 0.05, 2.0] }, active_only = true, workout_types = ["cycle"] }
active_energy = { mode = "chunks", chunk = { workout = [6.0, 0.5, 20.0], moving = [40.0, 1.0, 300.0], still = [150.0, 1.2, 600.0], sleep = [600.0, 0.6, 900.0] }, active_only = true, bridge_seconds = 60.0 }
basal_energy = { mode = "chunks", chunk = { workout = [6.0, 0.4, 15.0], moving = [60.0, 1.0, 900.0], still = [300.0, 1.2, 900.0], sleep = [600.0, 0.6, 900.0] }, bridge_seconds = 60.0 }
physical_effort = { mode = "mean_chunks", signal = "met", chunk = { workout = [10.0, 0.3, 20.0], moving = [20.0, 0.6, 120.0], still = [120.0, 1.0, 640.0] }, feature = "physical_effort" }
flights_climbed = { mode = "chunks", chunk = { moving = [4.0, 0.8, 400.0] }, active_only = true }
exercise_time = { mode = "minute_grid", min_met = 3.0 }
stand = { mode = "stand", min_upright_minutes = 1.0 }
hrv = { mode = "hrv", cadence = { sleep = [[1.0, 900.0, 0.12]], still = [[1.0, 1000.0, 0.3]] } }
respiratory_rate = { mode = "samples", cadence = { sleep = [[1.0, 603.0, 0.3]] }, quality = true, precision = 0.5 }
oxygen_saturation = { mode = "samples", cadence = { sleep = [[1.0, 1950.0, 0.15]], still = [[1.0, 9000.0, 0.7]] }, quality = true, precision = 1.0 }
environmental_audio = { mode = "mean_chunks", signal = "audio", chunk = { still = [1800.0, 0.05, 1800.0], moving = [1800.0, 0.05, 1800.0], workout = [1800.0, 0.05, 1800.0] } }
daylight = { mode = "mean_chunks", signal = "daylight", grid_seconds = 300.0, active_only = true, feature = "daylight" }
sleep = { mode = "sleep", in_bed = false, unspecified_probability = 0.012, merge_awake_under_minutes = 0.5, relabel_minutes = 14.0 }
resting_heart_rate = { mode = "daily", method = "awake_still_low_quantile" }
walking_heart_rate_average = { mode = "daily", method = "walking_mean" }
wrist_temperature = { mode = "nightly", feature = "wrist_temperature" }
breathing_disturbances = { mode = "nightly", feature = "breathing_disturbances" }
workout = { mode = "workout", vo2max = true, heart_rate_recovery = true, running_dynamics = true, route_seconds = 1.0 }
stair_ascent_speed = { mode = "stairs", feature = "stairs" }
stair_descent_speed = { mode = "stairs", feature = "stairs" }
audio_exposure_event = { mode = "audio_events", threshold_db = 80.0 }
electrocardiogram = { mode = "ecg", sampling_hz = 512.0, seconds = 30.0, feature = "ecg" }

[models.apple_watch.sleep_confusion]
source = "assumption: epoch sensitivities set from PSG studies (Schyvens et al. 2025, https://doi.org/10.1093/sleepadvances/zpaf021; Lee et al. 2023, https://doi.org/10.2196/50983; Robbins et al. 2024, https://doi.org/10.3390/s24206532): Apple Watch 8 wake ~50%, light high, deep ~41-51%, REM ~43-69%; rows are the true stage, columns the device label"
labels = ["awake", "light", "deep", "rem"]
matrix = [
  [0.50, 0.40, 0.01, 0.09],
  [0.05, 0.84, 0.05, 0.06],
  [0.01, 0.50, 0.48, 0.01],
  [0.04, 0.34, 0.01, 0.61],
]

