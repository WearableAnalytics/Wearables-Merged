# Device ownership, wear, signal quality and per-model measurement policies.
#
# Emission modes (devices/emit.py):
#   samples      point samples; renewal process with a lognormal mixture per context
#                [[weight, median_seconds, log_sigma], ...] or an exact clock grid
#   chunks       cumulative quantity split into intervals; value = integral of truth rate
#   mean_chunks  interval records whose value is the time-weighted mean of a truth signal
#   sync_chunks  cumulative quantity written as deltas between companion-app syncs
#   minute_grid  one record per clock minute that satisfies a condition (exercise time)
#   stand        Apple stand hours and 5-minute stand time
#   hrv          SDNN/RMSSD from simulated beat-to-beat windows
#   daily        derived from the device's own samples (resting HR, walking HR average)
#   nightly      one value per main sleep (wrist temperature, breathing disturbances)
#   sleep        classified stage intervals, optional in-bed record
#   workout      workout records, per-workout metrics (VO2max, HR recovery)
#   bout         gait metrics per walking bout (phone)
# Contexts: workout (recorded), sleep, still (awake sedentary), moving (other awake).

[meta]
version = "2026.11.1"

[ownership]
source = "assumption: wearable ownership falls with age; platform split roughly EU/US mix"
wearable_by_age = [[18, 0.62], [35, 0.55], [55, 0.42], [75, 0.28], [90, 0.18]]
archetype_multiplier = { sedentary = 0.6, weekend_warrior = 1.1, regular_exerciser = 1.3, athlete = 1.6, older_daily_walker = 1.0 }
ios_share = 0.55
ios_wearables = { apple_watch = 0.68, garmin = 0.20, oura = 0.08, withings_watch = 0.04 }
android_wearables = { samsung_watch = 0.42, pixel_watch = 0.13, fitbit = 0.25, garmin_android = 0.20 }
second_wearable_probability = 0.06
second_wearable = { ios = "oura", android = "oura_android" }
phone_motion_disabled_probability = 0.05
upgrade_rate_per_year = 0.22
abandonment_rate_per_year = 0.12
platform_switch_rate_per_year = 0.015
acquire_rate_per_year = 0.10          # phone-only personas who buy a wearable mid-timeline

[wear]
source = "assumption: missingness depends on the person (adherence trait) and state (illness, mood, low activity)"
adherence_beta = [4.0, 1.2]            # persona daily wear probability ~ Beta(a, b); LifeSnaps median wear 0.75 is reminder-inflated
offwrist_episode_days = [2.0, 0.9]     # median, log sigma of multi-day gaps
night_wear_beta = [3.0, 1.0]           # probability of wearing at night ~ Beta(a, b)
short_removal_per_day = 0.6
short_removal_minutes = [15.0, 0.6]
low_activity_penalty = 0.15            # extra off-wrist hazard for low activity personas

[signal]
source = "assumption: fit tendency plus motion, cold and tattoo penalties; acceptance is logistic in quality. Error scales set from published validations (see docs/PARAMETER_REVIEW in the project): HR, HRV, SpO2, energy, steps; not measured on the exports"
fit_mean = 0.86
fit_sigma = 0.07
day_sigma = 0.05
motion_penalty = 0.42
cold_penalty = 0.05
tattoo_share = 0.03
tattoo_penalty = 0.35
accept_midpoint = 0.42
accept_scale = 0.07
noise_multiplier = 3.0                 # noise sd *= 1 + noise_multiplier * (1 - q)
hrv_min_quality = 0.72
cadence_lock_quality = 0.62
cadence_lock_probability = 0.15
hr_motion_error_fraction = 0.06        # extra HR error sd as a fraction of HR, scaled by arm motion
hr_outlier_probability = 0.01          # sporadic large misreads, more likely at low quality
hr_outlier_sigma = 12.0                # bpm
spo2_bias = 0.5                        # percentage points, device minus truth (devices tend to overestimate)
spo2_error_sigma = 2.5                 # percentage points
hrv_bias = 0.0                         # log-scale bias of reported HRV
hrv_error_sigma = 0.10                 # log-scale spread of reported HRV
energy_bias_mean = 1.0                 # per-device multiplicative bias of active energy
energy_bias_sigma = 0.15
energy_noise_sigma = 0.08              # per-record log-normal error of active energy
step_day_sigma = 0.05                  # day-to-day multiplicative step error of a device

[delivery_defaults]
source = "assumption"
companion_sync_per_day = 4.0

