# Hard platform rules: OS releases, type availability, identifiers, history limits.

[meta]
version = "2026.11.1"

[ios]
source = "platform: Apple release dates; iOS 27 released 2026-09-14 (MacRumors, 2026-09-09 announcement)"
releases = [["17", "2023-09-18"], ["18", "2024-09-16"], ["26", "2025-09-15"], ["27", "2026-09-14"]]
adoption_lag_days = [12.0, 1.1]        # median, log sigma (assumption)

[android]
source = "assumption: Health Connect is a platform module; Android 14+ bundles it"
releases = [["14", "2023-10-04"], ["15", "2024-10-15"], ["16", "2025-06-10"]]
adoption_lag_days = [60.0, 1.0]

[history]
source = "platform: Health Connect apps read data up to 30 days before the first permission grant unless they hold the history permission; HealthKit exposes full history"
healthkit_days = -1
health_connect_days = 30
health_connect_history_permission_share = 0.3   # assumption

[dedup]
source = "platform: neither platform removes duplicates from raw reads; HealthKit statistics queries and Health Connect aggregates (Activity, Sleep) merge by source priority"
raw_reads_deduplicated = false

# Metric registry: canonical unit, value kind, and platform identifiers. A missing
# identifier means the type does not exist on that platform and is never emitted there.
# requires = minimum OS major version on that platform.
[metrics]
source = "platform: HealthKit HKQuantityTypeIdentifier/HKCategoryTypeIdentifier names and Health Connect record types"
heart_rate = { unit = "count/min", kind = "quantity", healthkit = "HKQuantityTypeIdentifierHeartRate", health_connect = "HeartRateRecord" }
resting_heart_rate = { unit = "count/min", kind = "quantity", healthkit = "HKQuantityTypeIdentifierRestingHeartRate", health_connect = "RestingHeartRateRecord" }
walking_heart_rate_average = { unit = "count/min", kind = "quantity", healthkit = "HKQuantityTypeIdentifierWalkingHeartRateAverage" }
heart_rate_recovery = { unit = "count/min", kind = "quantity", healthkit = "HKQuantityTypeIdentifierHeartRateRecoveryOneMinute", requires_ios = 16 }
hrv_sdnn = { unit = "ms", kind = "quantity", healthkit = "HKQuantityTypeIdentifierHeartRateVariabilitySDNN" }
hrv_rmssd = { unit = "ms", kind = "quantity", healthkit = "HKQuantityTypeIdentifierHeartRateVariabilityRMSSD", requires_ios = 27, health_connect = "HeartRateVariabilityRmssdRecord" }
respiratory_rate = { unit = "count/min", kind = "quantity", healthkit = "HKQuantityTypeIdentifierRespiratoryRate", health_connect = "RespiratoryRateRecord" }
oxygen_saturation = { unit = "%", kind = "quantity", healthkit = "HKQuantityTypeIdentifierOxygenSaturation", health_connect = "OxygenSaturationRecord" }
wrist_temperature = { unit = "degC", kind = "quantity", healthkit = "HKQuantityTypeIdentifierAppleSleepingWristTemperature", requires_ios = 16, health_connect = "SkinTemperatureRecord" }
breathing_disturbances = { unit = "count", kind = "quantity", healthkit = "HKQuantityTypeIdentifierAppleSleepingBreathingDisturbances", requires_ios = 18 }
vo2max = { unit = "ml/kg/min", kind = "quantity", healthkit = "HKQuantityTypeIdentifierVO2Max", health_connect = "Vo2MaxRecord" }
steps = { unit = "count", kind = "quantity", healthkit = "HKQuantityTypeIdentifierStepCount", health_connect = "StepsRecord" }
distance_walking_running = { unit = "m", kind = "quantity", healthkit = "HKQuantityTypeIdentifierDistanceWalkingRunning", health_connect = "DistanceRecord" }
distance_cycling = { unit = "m", kind = "quantity", healthkit = "HKQuantityTypeIdentifierDistanceCycling", health_connect = "DistanceRecord" }
active_energy = { unit = "kcal", kind = "quantity", healthkit = "HKQuantityTypeIdentifierActiveEnergyBurned", health_connect = "ActiveCaloriesBurnedRecord" }
basal_energy = { unit = "kcal", kind = "quantity", healthkit = "HKQuantityTypeIdentifierBasalEnergyBurned", health_connect = "BasalMetabolicRateRecord" }
physical_effort = { unit = "kcal/hr/kg", kind = "quantity", healthkit = "HKQuantityTypeIdentifierPhysicalEffort", requires_ios = 17 }
flights_climbed = { unit = "count", kind = "quantity", healthkit = "HKQuantityTypeIdentifierFlightsClimbed", health_connect = "FloorsClimbedRecord" }
exercise_time = { unit = "min", kind = "quantity", healthkit = "HKQuantityTypeIdentifierAppleExerciseTime" }
stand_time = { unit = "min", kind = "quantity", healthkit = "HKQuantityTypeIdentifierAppleStandTime" }
stand_hour = { unit = "", kind = "category", healthkit = "HKCategoryTypeIdentifierAppleStandHour" }
time_in_daylight = { unit = "min", kind = "quantity", healthkit = "HKQuantityTypeIdentifierTimeInDaylight", requires_ios = 17 }
environmental_audio = { unit = "dBASPL", kind = "quantity", healthkit = "HKQuantityTypeIdentifierEnvironmentalAudioExposure" }
