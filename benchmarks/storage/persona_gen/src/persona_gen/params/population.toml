[habits]
source = "assumption: rare behaviours kept for anchor-like personas (spec: Person B quirks are not typical)"
micro_workout_share = 0.02          # personas who log very short (~2 min) strength sets
micro_workouts_per_day = [1.0, 4.0]
nutrition_logger_share = 0.03
manual_weight_logger_share = 0.12
smart_scale_share = 0.06
bp_cuff_share_hypertensive = 0.35
headphone_listener_share = 0.55
alcohol_logger_share = 0.02
alcohol_drinks_per_day = [0.1, 1.5]   # persona mean range
height_logger_share = 0.25           # personas with a height record (Health app profile)
ecg_user_share = 0.04                # Apple Watch owners who take on-demand ECGs
ecg_per_week = [0.2, 2.0]
afib_history_share = { atrial_fibrillation = 0.6, other = 0.02 }
