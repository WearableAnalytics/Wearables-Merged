# Generated by persona_gen.calibration.calibrate_lifesnaps from the LifeSnaps
# dataset (Yfantidou et al. 2022, CC BY 4.0). Do not edit by hand; re-run the calibration.

[meta]
target = "devices"
version = "calibration:lifesnaps-bson"

[models.fitbit_sense]
source = "spec: Fitbit Sense as worn in LifeSnaps (2021-22); writes to Health Connect on Android"
extends = "fitbit"
kind = "watch"
hardware = "Fitbit Sense"
available_from = "2020-09-25"
features = [
    "wrist_temperature",
]

[models.fitbit_sense.metrics]
source = "calibrated: LifeSnaps fitbit.bson (71 people, Fitbit Sense, CC BY 4.0); HR cadence = 2-component lognormal mixtures per context pooled across people; HRV window cadence from 'Heart Rate Variability Details'; resting HR method chosen by comparing Fitbit RHR with awake and asleep HR quantiles"

[models.fitbit_sense.metrics.heart_rate]
mode = "samples"
quality = true

[models.fitbit_sense.metrics.heart_rate.cadence]
workout = [
    [
        0.6977,
        4.458,
        0.5317,
    ],
    [
        0.3023,
        1.0,
        0.001,
    ],
]
sleep = [
    [
        0.6025,
        5.0,
        0.001,
    ],
    [
        0.3975,
        11.784,
        0.3266,
    ],
]
still = [
    [
        0.7396,
        5.0,
        0.001,
    ],
    [
        0.2604,
        10.59,
        0.4208,
    ],
]
moving = [
    [
        0.7704,
        4.869,
        0.1877,
    ],
    [
        0.2296,
        11.282,
        0.1957,
    ],
]

[models.fitbit_sense.metrics.resting_heart_rate]
mode = "daily"
method = "awake_still_low_quantile"

[models.fitbit_sense.metrics.hrv]
mode = "hrv"
nightly_only = true

[models.fitbit_sense.metrics.hrv.cadence]
sleep = [
    [
        1.0,
        300.0,
        0.1,
    ],
]

[ownership.android_wearables]
fitbit = 0.15
fitbit_sense = 0.10
