openapi: 3.0.3
info:
  title: Patient & Case API
  description: |
    Endpoints for fetching read-only Charité cases and managing internal patients/cases.
    
    ## Frontend Flow
    
    ### New Patient Creation from Charité Case
    1. Enter a Charité case ID (cCaseId)
    2. Fetch and display the external Charité case
    3. User clicks "Create Case" to create an internal case
    4. Show that patient/case was created and store the caseId
    5. Display the case token as QR code for scanning in the Charité app
    
    ### Existing Patient Access
    1. Fetch all internal patients/cases
    2. User selects a patient/case to view details
    3. Display case details and show case token as QR code
    
    ## App Flow
    1. Receive a caseToken scanned from Charité app
    2. Fetch the internal case using POST /cases/verify-token
    3. Display case details
    4. Allow user to proceed with further actions
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: https://api.example.com/v1
    description: Production server

tags:
  - name: Charité Cases
    description: Read-only external Charité cases
  - name: Patients
    description: Internal patient management
  - name: Cases
    description: Internal case management

paths:
  /charite/cases/{cCaseId}:
    get:
      tags:
        - Charité Cases
      summary: Get a Charité case
      description: Returns a read-only Charité case by ID
      operationId: getChariteCase
      parameters:
        - name: cCaseId
          in: path
          required: true
          description: Charité case identifier
          schema:
            type: string
            example: C-123456
      responses:
        '200':
          description: Charité case retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChariteCase'
        '404':
          description: Charité case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /patients:
    get:
      tags:
        - Patients
      summary: List internal patients
      description: Returns a list of all internal patients
      operationId: listPatients
      responses:
        '200':
          description: List of patients retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'


  /patients/{patientId}:
    get:
      tags:
        - Patients
      summary: Get a single patient
      description: Returns a single internal patient by ID
      operationId: getPatient
      parameters:
        - name: patientId
          in: path
          required: true
          description: Internal patient identifier
          schema:
            type: string
            example: P-98765
      responses:
        '200':
          description: Patient retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /patients/{patientId}/cases:
    get:
      tags:
        - Patients
      summary: List cases for a patient
      description: Returns all cases linked to a specific patient
      operationId: listPatientCases
      parameters:
        - name: patientId
          in: path
          required: true
          description: Internal patient identifier
          schema:
            type: string
            example: P-98765
      responses:
        '200':
          description: List of cases retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cases:
    get:
      tags:
        - Cases
      summary: List all internal cases
      description: Returns a list of all internal cases
      operationId: listCases
      responses:
        '200':
          description: List of cases retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'

  /cases/{caseId}:
    get:
      tags:
        - Cases
      summary: Get a single case
      description: Returns a single internal case by ID
      operationId: getCase
      parameters:
        - name: caseId
          in: path
          required: true
          description: Internal case identifier
          schema:
            type: string
            example: IC-54321
      responses:
        '200':
          description: Case retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '404':
          description: Case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cases/from-charite-case:
    post:
      tags:
        - Cases
      summary: Create internal case from Charité case
      description: |
        Creates an internal case from an external Charité case with the following logic:
        - If patient exists but case doesn't: creates new case and links to existing patient
        - If patient doesn't exist: creates new patient and new case
        - If both patient and case exist: returns existing case
        - Otherwise: returns error
      operationId: createCaseFromCharite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cCaseId
              properties:
                cCaseId:
                  type: string
                  description: Charité case identifier
                  example: C-123456
      responses:
        '201':
          description: Case created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCreated'
        '200':
          description: Case already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCreated'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Charité case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cases/verify-token:
    post:
      tags:
        - Cases
      summary: Verify a case token
      description: Verifies a case token and returns the linked case information
      operationId: verifyCaseToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - caseToken
              properties:
                caseToken:
                  type: string
                  description: JWT case token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpX...
      responses:
        '200':
          description: Token verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseVerified'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ChariteCase:
      type: object
      description: External read-only Charité case
      required:
        - cCaseId
        - firstName
        - lastName
        - birthDate
      properties:
        cCaseId:
          type: string
          description: Charité case identifier
          example: C-123456
        firstName:
          type: string
          description: Patient first name
          example: Max
        lastName:
          type: string
          description: Patient last name
          example: Mustermann
        birthDate:
          type: string
          format: date
          description: Patient date of birth
          example: '1980-01-01'

    Patient:
      type: object
      description: Internal patient
      required:
        - patientId
        - firstName
        - lastName
        - birthDate
      properties:
        patientId:
          type: string
          description: Internal patient identifier
          example: P-98765
        firstName:
          type: string
          description: Patient first name
          example: Max
        lastName:
          type: string
          description: Patient last name
          example: Mustermann
        birthDate:
          type: string
          format: date
          description: Patient date of birth
          example: '1980-01-01'
    Case:
      type: object
      description: Internal case
      required:
        - caseId
        - patientId
        - status
      properties:
        caseId:
          type: string
          description: Internal case identifier
          example: IC-54321
        patientId:
          type: string
          description: Associated patient identifier
          example: P-98765
        cCaseId:
          type: string
          description: Original Charité case identifier
          example: C-123456
        status:
          type: string
          enum:
            - active
            - inactive
          description: Case status
          example: active
        caseToken:
          type: string
          description: JWT token for case access
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    CaseCreated:
      type: object
      description: Response after case creation
      required:
        - patientId
        - caseId
        - caseToken
      properties:
        patientId:
          type: string
          description: Internal patient identifier
          example: P-98765
        caseId:
          type: string
          description: Internal case identifier
          example: IC-54321
        caseToken:
          type: string
          description: JWT token for case access
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    CaseVerified:
      type: object
      description: Response after token verification
      required:
        - caseId
        - patientVerifier
        - status
      properties:
        caseId:
          type: string
          description: Internal case identifier
          example: IC-54321
        patientVerifier:
          type: string
          description: |
            Patient verification string built from first letter of first name,
            birthdate (DDMM), and first letter of last name.
            Example: Max Bauer born 02.12.2000 → M0212B
          example: M0212B
        status:
          type: string
          enum:
            - active
            - inactive
          description: Case status
          example: active

    Error:
      type: object
      description: Error response
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
          example: Resource not found
        code:
          type: string
          description: Error code
          example: NOT_FOUND