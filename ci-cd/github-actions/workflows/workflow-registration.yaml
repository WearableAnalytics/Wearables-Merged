name: upload-on-push-wearables-bff
run-name: Build and push the image to the repo by @${{ github.actor }}
on:
  push:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-login
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: build-and-push
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./services/backend/wearables-bff
          file: ./services/backend/wearables-bff/Dockerfile
          push: true
          tags: gmsdaniil/wearables-bff:latest
