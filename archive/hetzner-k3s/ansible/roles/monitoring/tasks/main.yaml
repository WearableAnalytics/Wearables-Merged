---
- name: Install required packages
  apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
      - python3-pip
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: yes

- name: Install Python Kubernetes library via pip with break-system-packages
  pip:
    name:
      - kubernetes
      - PyYAML
    state: present
    executable: pip3
    extra_args: --break-system-packages
  ignore_errors: yes

- name: Check if Helm is installed
  command: which helm
  register: helm_check
  ignore_errors: yes
  changed_when: false

- name: Download Helm installation script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: '0700'
  when: helm_check.rc != 0

- name: Install Helm
  command: /tmp/get_helm.sh
  when: helm_check.rc != 0

- name: Remove Helm installation script
  file:
    path: /tmp/get_helm.sh
    state: absent
  when: helm_check.rc != 0

- name: Set KUBECONFIG environment variable
  set_fact:
    k8s_kubeconfig: "/etc/rancher/k3s/k3s.yaml"

- name: Add Prometheus Helm repository
  kubernetes.core.helm_repository:
    name: "{{ helm_chart_repo }}"
    repo_url: "{{ helm_chart_url }}"
  environment:
    KUBECONFIG: "{{ k8s_kubeconfig }}"

- name: Create monitoring namespace manifest
  copy:
    dest: /tmp/monitoring-namespace.yaml
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ monitoring_namespace }}
        labels:
          name: {{ monitoring_namespace }}
          app.kubernetes.io/name: {{ monitoring_namespace }}

- name: Create monitoring namespace
  kubernetes.core.k8s:
    state: present
    src: /tmp/monitoring-namespace.yaml
    kubeconfig: "{{ k8s_kubeconfig }}"

- name: Create Grafana admin credentials secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-admin-credentials
        namespace: "{{ monitoring_namespace }}"
      type: Opaque
      stringData:
        admin-user: "{{ grafana_admin_user }}"
        admin-password: "{{ grafana_admin_password }}"

- name: Create AlertManager configuration secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: alertmanager-config
        namespace: "{{ monitoring_namespace }}"
      type: Opaque
      stringData:
        alertmanager.yml: |
          global:
            resolve_timeout: 5m

          route:
            group_by: ['alertname', 'cluster', 'service']
            group_wait: 10s
            group_interval: 10s
            repeat_interval: 12h
            receiver: 'default'
            routes:
              - match:
                  severity: critical
                receiver: 'critical'
              - match:
                  severity: warning
                receiver: 'warning'

          receivers:
            - name: 'default'
            - name: 'critical'
            - name: 'warning'

          inhibit_rules:
            - source_match:
                severity: 'critical'
              target_match:
                severity: 'warning'
              equal: ['alertname', 'cluster', 'service']

- name: Create Helm values file
  template:
    src: prometheus-stack-values.yaml.j2
    dest: /tmp/prometheus-stack-values.yaml

- name: Install kube-prometheus-stack via Helm
  kubernetes.core.helm:
    name: "{{ helm_release_name }}"
    chart_ref: "{{ helm_chart_repo }}/{{ helm_chart_name }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: false
    values_files:
      - /tmp/prometheus-stack-values.yaml
    kubeconfig: "{{ k8s_kubeconfig }}"
    wait: yes
    wait_timeout: 10m

- name: Wait for Prometheus Operator to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ monitoring_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=prometheus-operator
    kubeconfig: "{{ k8s_kubeconfig }}"
  register: prometheus_operator_pods
  until: prometheus_operator_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
  retries: 30
  delay: 10

- name: Wait for Prometheus to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ monitoring_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=prometheus
    kubeconfig: "{{ k8s_kubeconfig }}"
  register: prometheus_pods
  until: prometheus_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
  retries: 30
  delay: 10

- name: Wait for Grafana to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ monitoring_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=grafana
    kubeconfig: "{{ k8s_kubeconfig }}"
  register: grafana_pods
  until: grafana_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
  retries: 30
  delay: 10

- name: Wait for AlertManager to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ monitoring_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=alertmanager
    kubeconfig: "{{ k8s_kubeconfig }}"
  register: alertmanager_pods
  until: alertmanager_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
  retries: 30
  delay: 10

- name: Get monitoring services
  kubernetes.core.k8s_info:
    kind: Service
    namespace: "{{ monitoring_namespace }}"
    kubeconfig: "{{ k8s_kubeconfig }}"
  register: monitoring_services

- name: Display monitoring stack information
  debug:
    msg:
      - "=== Monitoring Stack Installed Successfully ==="
      - "Namespace: {{ monitoring_namespace }}"
      - "Grafana: kubectl port-forward -n {{ monitoring_namespace }} svc/{{ helm_release_name }}-grafana 3000:80"
      - "Prometheus: kubectl port-forward -n {{ monitoring_namespace }} svc/prometheus-operated 9090:9090"
      - "AlertManager: kubectl port-forward -n {{ monitoring_namespace }} svc/alertmanager-operated 9093:9093"
      - ""
      - "Default Grafana credentials:"
      - "  Username: {{ grafana_admin_user }}"
      - "  Password: {{ grafana_admin_password }}"
      - ""
      - "Access URLs (after port-forward):"
      - "  - Grafana: http://localhost:3000"
      - "  - Prometheus: http://localhost:9090"
      - "  - AlertManager: http://localhost:9093"
