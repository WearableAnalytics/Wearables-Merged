apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wearables-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/WearableAnalytics/Wearables-Merged.git
    targetRevision: main
    path: gitops/setup/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # The Argo CD Image Updater writes the image versions as Helm parameters into
  # the child Applications. Without this, selfHeal would reset them to git.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/helm/parameters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
