# Production: rendered by root-app.yaml from main.
# The local minikube cluster adds values-local.yaml (gitops/local/argocd/root-app.yaml).
repoURL: https://github.com/WearableAnalytics/Wearables-Merged.git
revision: main

valueFiles:
  - values.yaml

deleteResources: false

apps:
  # Platform & Data Stores (prune: false protects persistent volumes & state)
  - name: prod-postgres
    path: gitops/apps/platform/prod-postgres
    namespace: prod-postgres
    prune: false
  - name: influxdb
    path: gitops/apps/monitoring/influxdb
    namespace: influx
    prune: false
  - name: kafka
    path: gitops/apps/platform/kafka
    namespace: kafka
    prune: false

  # Application Services
  - name: db-lord
    path: gitops/apps/services/db-lord
    namespace: db-lord
  - name: extraction-service
    path: gitops/apps/services/extraction-service
    namespace: extraction-service
  - name: cloud-connector
    path: gitops/apps/services/cloud-connector
    namespace: cloud-connector
  - name: importservice
    path: gitops/apps/services/importservice
    namespace: importservice
  - name: mapper-validator
    path: gitops/apps/services/mapper-validator
    namespace: kafka
  - name: wearables-bff
    path: gitops/apps/services/wearables-bff
    namespace: wearables-bff
  - name: web-frontend
    path: gitops/apps/web-frontend
    namespace: web
    releaseName: web          # as in setup-script.sh

  # Monitoring & Visualization
  - name: grafana
    path: gitops/apps/monitoring/grafana
    namespace: grafana
  - name: grafana-proxy
    path: gitops/apps/monitoring/grafana-proxy
    namespace: monitoring
