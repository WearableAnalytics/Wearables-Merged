apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-connector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WearableAnalytics/Wearables-Merged.git
    targetRevision: main
    path: gitops/apps/services/cloud-connector
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-connector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
