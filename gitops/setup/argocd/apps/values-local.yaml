# Local minikube cluster (setup-local.sh --argocd): only the differences to values.yaml.
# In local minikube, platform datastores (Kafka, Postgres, InfluxDB) are managed by setup-local.sh via Helm.
valueFiles:
  - values.yaml
  - values-local.yaml

deleteResources: true

apps:
  - name: cloud-connector
    path: gitops/apps/services/cloud-connector
    namespace: cloud-connector
  - name: importservice
    path: gitops/apps/services/importservice
    namespace: importservice
  - name: mapper-validator
    path: gitops/apps/services/mapper-validator
    namespace: kafka
  - name: wearables-bff
    path: gitops/apps/services/wearables-bff
    namespace: wearables-bff
  - name: web-frontend
    path: gitops/apps/web-frontend
    namespace: web
    releaseName: web          
  - name: grafana-proxy
    path: gitops/apps/monitoring/grafana-proxy
    namespace: monitoring
