apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wearables-bff
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WearableAnalytics/Wearables-Merged.git
    targetRevision: main
    path: gitops/apps/services/wearables-bff
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: wearables-bff
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
