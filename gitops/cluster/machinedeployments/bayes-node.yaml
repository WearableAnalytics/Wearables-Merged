apiVersion: cluster.k8s.io/v1alpha1
kind: MachineDeployment
metadata:
  annotations:
    k8c.io/operating-system-profile: osp-ubuntu
  name: bayes-node
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      machine: md-${KKP_CLUSTER_ID}-bayes
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        machine: md-${KKP_CLUSTER_ID}-bayes
    spec:
      metadata:
        labels:
          machine: md-${KKP_CLUSTER_ID}-bayes
          system/cluster: ${KKP_CLUSTER_ID}
          system/project: ${KKP_PROJECT_ID}
          workload: bayes
      providerSpec:
        value:
          caPublicKey: ""
          cloudProvider: openstack
          cloudProviderSpec:
            applicationCredentialID: ""
            applicationCredentialSecret: ""
            availabilityZone: nova
            computeAPIVersion: ""
            configDrive: false
            domainName: ""
            flavor: de.NBI small
            floatingIpPool: public
            identityEndpoint: https://denbi-cloud.bihealth.org:13000/v3
            image: Ubuntu-24.04
            instanceReadyCheckPeriod: 5s
            instanceReadyCheckTimeout: 120s
            network: kubernetes-${KKP_CLUSTER_ID}
            password: ""
            projectID: ""
            projectName: ""
            region: regionOne
            rootDiskSizeGB: 100
            rootDiskVolumeType: ""
            securityGroups:
            - kubernetes-${KKP_CLUSTER_ID}
            serverGroup: ""
            subnet: ${OS_SUBNET_ID}
            tags:
              kubernetes-cluster: ${KKP_CLUSTER_ID}
              purpose: bayes
              system-cluster: ${KKP_CLUSTER_ID}
              system-project: ${KKP_PROJECT_ID}
            tenantID: ""
            tenantName: ""
            tokenId: ""
            trustDevicePath: false
            username: ""
          network:
            cidr: ""
            gateway: ""
            ipFamily: IPv4
          operatingSystem: ubuntu
          operatingSystemSpec:
            distUpgradeOnBoot: false
          sshPublicKeys: ${SSH_PUBLIC_KEYS_JSON}
      versions:
        kubelet: 1.31.13
