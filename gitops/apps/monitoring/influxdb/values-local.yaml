# Local minikube: small volume, automatic first-start setup.
persistence:
  size: 2Gi                  # Prod: 10Gi
  storageClass: standard     # Prod: local-path

initSetup:
  enabled: true
  username: admin
  password: admin-password   # local only
  org: wearables-project
  bucket: measurements
  token: dev-influx-token    # local only
