image:
  repository: node
  tag: "20-alpine"

session:
  cookieName: "session"
  jwtSecret: "change-me-session-secret"

grafana:
  jwtHeader: "X-JWT-Assertion"
  jwtKeyId: "grafana-key-1"
  jwtIssuer: "wearables-auth"
  jwtAudience: "wearables-grafana"
  jwtTtlSeconds: 300
  defaultRole: "Viewer"
  jwtPrivateKey: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
