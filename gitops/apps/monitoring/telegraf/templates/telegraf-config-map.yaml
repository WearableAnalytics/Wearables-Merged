apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-config"
data:
  telegraf.conf: |
    [global_tags]

    [agent]
      interval = "500ms"
      metric_batch_size = 10000
      metric_buffer_limit = 500000
      flush_interval = "500ms"
      flush_jitter = "0s"
      buffer_strategy = "memory"
      debug = false
      quiet = true
      omit_hostname = false

    [[inputs.kafka_consumer]]
      brokers = ["{{ .Values.config.kafkaConsumer.name }}-kafka-bootstrap.{{ .Values.config.kafkaConsumer.namespace }}.svc.cluster.local:9092"]
      topics = [{{ range $i, $t := .Values.config.kafkaConsumer.topics }}{{ if $i }}, {{ end }}"{{ $t }}"{{ end }}]
      consumer_group = "metrics"
      max_message_len = 5000000
      consumer_fetch_default = "10MB"
      version = "{{ .Values.config.kafkaConsumer.version }}"
      data_format = "influx"

    [[outputs.influxdb_v2]]
      urls = ["http://{{ .Values.config.influxProducer.name }}-service.{{ .Values.config.influxProducer.namespace }}.svc.cluster.local:{{ .Values.config.influxProducer.port }}"]
      token = "{{ .Values.config.influxProducer.token }}"
      organization = "{{ .Values.config.influxProducer.org }}"
      bucket = "{{ .Values.config.influxProducer.bucket }}"