# Local minikube: image built into minikube, embeds Grafana served under /proxy/.
image:
  repository: wearables-local/grafana-proxy
  tag: dev
  pullPolicy: Never                  # use the image built into minikube

ingress:
  host: wearables.localhost          # Prod: wearables.charite.de

grafana:
  pathPrefix: /proxy                 # Prod: ""; matches server.subPath of the grafana chart
  allowedDashboardIds: "wearables-health-real,wearables-six-min,adgf864"  # Prod: ...,AI_PLACEHOLDER_TODO
