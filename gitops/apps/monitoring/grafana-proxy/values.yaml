replicaCount: 1

image:
  # Docker image for the grafana-proxy-node service
  repository: gmsdaniil/wearables-grafana-proxy
  pullPolicy: Always
  tag: "latest"

configMap:
  create: true
  name: ""

secret:
  create: false
  name: ""
  data:
    APP_JWT_SECRET: "change-me"
    GRAFANA_JWT_PRIVATE_KEY: ""

proxy:
  # Internal proxy HTTP port
  port: 3002
  # Public path prefix where the proxy is exposed
  # Keep this aligned with frontend runtimeConfig.grafanaProxyUrl and your external route
  prefix: "/proxy"

ingress:
  enabled: true
  host: "wearables.charite.de"
  pathPrefix: "/proxy"
  httpOnly: true
  certificateSecretName: "wearables-tls"

session:
  # Expected issuer of wearables-bff case tokens used as /embed deviceId
  jwtIssuer: "wearables-bff"

grafana:
  # In-cluster Grafana URL (adjust release/namespace as needed)
  baseUrl: "http://grafana.grafana.svc.cluster.local:3000"
  pathPrefix: ""

  # JWT header configuration
  jwtHeader: "X-JWT-Assertion"
  jwtIssuer: "wearables-grafana-proxy"
  jwtAudience: "grafana"
  jwtTtlSeconds: "300"
  tlsSkipVerify: "false"
  jwtIatSkewSeconds: "120"

  # Dashboard configuration for the /embed endpoint
  # AI_PLACEHOLDER_TODO: replace with the final AI Insights dashboard UID when available.
  allowedDashboardIds: "wearables-health-real,wearables-six-min,AI_PLACEHOLDER_TODO"
  dashboardDatasource: "dfa4opgnfgg00e"
  orgId: "1"
