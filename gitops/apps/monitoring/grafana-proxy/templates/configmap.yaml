apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-code
data:
  package.json: |
    {
      "name": "grafana-proxy",
      "type": "module",
      "dependencies": {
        "jsonwebtoken": "^9.0.2",
        "http-proxy-middleware": "^3.0.3"
      }
    }
  server.mjs: |
    import http from 'node:http';
    import { createProxyMiddleware } from 'http-proxy-middleware';
    import jwt from 'jsonwebtoken';
    import { createPublicKey } from 'crypto';

    const config = {
      port: Number(process.env.PORT) || 3002,
      proxyPrefix: process.env.PROXY_PREFIX || '/grafana',
      sessionCookieName: process.env.SESSION_COOKIE_NAME || 'jwt',
      appJwtSecret: process.env.APP_JWT_SECRET || 'dev-secret',
      grafanaBaseUrl: process.env.GRAFANA_BASE_URL || 'http://localhost:3000',
      grafanaPathPrefix: process.env.GRAFANA_PATH_PREFIX || '',
      grafanaJwtHeader: process.env.GRAFANA_JWT_HEADER || 'X-JWT-Assertion',
      grafanaJwtKeyId: process.env.GRAFANA_JWT_KEY_ID || 'grafana-proxy',
      grafanaJwtIssuer: process.env.GRAFANA_JWT_ISSUER || 'wearables-grafana-proxy',
      grafanaJwtAudience: process.env.GRAFANA_JWT_AUDIENCE || 'grafana',
      grafanaJwtTtlSeconds: Number(process.env.GRAFANA_JWT_TTL_SECONDS) || 300,
      grafanaDefaultRole: process.env.GRAFANA_DEFAULT_ROLE || 'Viewer',
      grafanaJwtPrivateKey: process.env.GRAFANA_JWT_PRIVATE_KEY.replace(/\\n/g, '\n'),
    };

    const grafanaPublicKey = createPublicKey(config.grafanaJwtPrivateKey);
    const grafanaPublicJwk = grafanaPublicKey.export({ format: 'jwk' });
    const jwks = {
      keys: [{
        ...grafanaPublicJwk,
        kid: config.grafanaJwtKeyId,
        use: 'sig',
        alg: 'RS256',
      }]
    };

    const parseCookies = (cookieHeader) => {
      if (!cookieHeader) return {};
      return cookieHeader.split(';').reduce((acc, part) => {
        const [name, ...rest] = part.split('=');
        if (name && rest.length > 0) {
          acc[name.trim()] = decodeURIComponent(rest.join('='));
        }
        return acc;
      }, {});
    };

    const validateSession = (token) => {
      try {
        return jwt.verify(token, config.appJwtSecret, { algorithms: ['HS256'] });
      } catch {
        return null;
      }
    };

    const createGrafanaJwt = (sessionPayload) => {
      const now = Math.floor(Date.now() / 1000);
      return jwt.sign(
        {
          sub: sessionPayload.userId || sessionPayload.sub,
          email: sessionPayload.email || sessionPayload.sub,
          name: sessionPayload.name,
          role: config.grafanaDefaultRole,
          exp: now + config.grafanaJwtTtlSeconds,
          iat: now,
          iss: config.grafanaJwtIssuer,
          aud: config.grafanaJwtAudience,
        },
        config.grafanaJwtPrivateKey,
        { algorithm: 'RS256', keyid: config.grafanaJwtKeyId }
      );
    };

    const proxy = createProxyMiddleware({
      target: config.grafanaBaseUrl,
      changeOrigin: true,
      pathRewrite: (path) => {
        const withoutPrefix = path.replace(new RegExp(`^${config.proxyPrefix}`), '');
        return config.grafanaPathPrefix + withoutPrefix;
      },
      onProxyReq: (proxyReq, req) => {
        const cookies = parseCookies(req.headers.cookie);
        const sessionToken = cookies[config.sessionCookieName];

        if (!sessionToken) {
          console.log('No session cookie found');
          return;
        }

        const sessionPayload = validateSession(sessionToken);
        if (!sessionPayload) {
          console.log('Invalid session token');
          return;
        }

        const grafanaJwt = createGrafanaJwt(sessionPayload);
        proxyReq.setHeader(config.grafanaJwtHeader, grafanaJwt);
      },
    });

    const server = http.createServer((req, res) => {
      if (req.url === '/.well-known/jwks.json') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify(jwks));
        return;
      }

      if (req.url === '/health') {
        res.writeHead(200, { 'Content-Type': 'text/plain' });
        res.end('OK');
        return;
      }

      proxy(req, res, (err) => {
        if (err) {
          console.error('Proxy error:', err);
          res.writeHead(500);
          res.end('Proxy error');
        }
      });
    });

    server.listen(config.port, () => {
      console.log(`Grafana proxy listening on port ${config.port}`);
      console.log(`JWKS available at /.well-known/jwks.json`);
    });
