apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Release.Name }}
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        checksum/provisioning: {{ include (print $.Template.BasePath "/provisioning.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          env:
            - name: GF_SERVER_ROOT_URL
              value: {{ if .Values.ingress.httpOnly }}http{{ else }}https{{ end }}://{{ .Values.ingress.host }}{{ .Values.ingress.prefix }}
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            # - name: GF_SECURITY_COOKIE_SAMESITE
            #   value: "none"
            {{- if .Values.security.csrfTrustedOrigins }}
            - name: GF_SECURITY_CSRF_TRUSTED_ORIGINS
              value: {{ .Values.security.csrfTrustedOrigins | quote }}
            {{- end }}
            # - name: GF_AUTH_JWT_ENABLED
            #   value: "true"
            # - name: GF_AUTH_JWT_HEADER_NAME
            #   value: "X-JWT-Assertion"
            # - name: GF_AUTH_JWT_EMAIL_CLAIM
            #   value: "email"
            # - name: GF_AUTH_JWT_USERNAME_CLAIM
            #   value: "sub"
            # - name: GF_AUTH_JWT_AUTO_SIGN_UP
            #   value: "true"
            # - name: GF_AUTH_JWT_JWK_SET_URL
            #   value: "http://grafana-auth.{{ .Release.Namespace }}.svc.cluster.local/.well-known/jwks.json"
          ports:
            - containerPort: {{ .Values.container.port }}
              name: "http-{{ .Release.Name }}"
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: {{ .Values.container.port }}
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: {{ .Values.container.port }}
            timeoutSeconds: 1
          resources:
            requests:
              cpu: {{ .Values.resourceRequests.cpu }}
              memory: {{ .Values.resourceRequests.mem }}
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: "{{ .Release.Name }}-storage"
            - name: grafana-config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana-dashboards
              readOnly: true
      volumes:
        - name: "{{ .Release.Name }}-storage"
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-pvc"
        - name: grafana-config
          configMap:
            name: grafana-config
            items:
              - key: grafana.ini
                path: grafana.ini
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards 
