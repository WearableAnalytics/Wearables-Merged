apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ .Release.Name }}-http"
spec:
  entryPoints:
    - web 
  routes:
    - match: "Host(`{{ .Values.ingress.host }}`){{ if .Values.ingress.httpOnly }} && PathPrefix(`{{ .Values.ingress.prefix }}`){{ end }}"
      kind: Rule
      middlewares:
{{- if not .Values.ingress.httpOnly }}
      - name: redirect-to-https
        namespace: ingress
{{- end }}
      - name: grafana-forward-headers
      services:
        - name: {{ .Release.Name }}
          port: {{ .Values.container.port }}