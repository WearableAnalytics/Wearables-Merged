{{- if not .Values.ingress.httpOnly }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ .Release.Name }}-https"
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ .Values.ingress.host }}`) && PathPrefix(`{{ .Values.ingress.prefix }}`)"
      kind: Rule
      {{- with .Values.ingress.authMiddleware }}
      middlewares:
        - name: {{ . }}
          namespace: {{ $.Release.Namespace }}
      {{- end }}
      services:
        - name: {{ .Release.Name }}
          port: {{ .Values.container.port }}
  tls:
    secretName: {{ .Values.certificate.secretName }}
{{- end }}