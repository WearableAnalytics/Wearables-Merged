# Local minikube: small footprint, InfluxDB datasource and patient dashboards,
# served under /proxy/ so grafana-proxy can embed it (as in the Docker Compose stack).
resourceRequests:
  cpu: 100m                  # Prod: 1
  mem: 256Mi                 # Prod: 2Gi

persistence:
  storageClassName: standard # Prod: cinder-csi

ingress:
  host: wearables.localhost  # Prod: wearables.charite.de
  httpOnly: true

server:
  subPath: /proxy            # Prod: the ingress prefix /grafana

security:
  csrfTrustedOrigins: "http://wearables.localhost"

prometheus:
  url: http://prometheus-service.monitoring.svc.cluster.local  # Prod value points to namespace "prometheus"

influxDatasource:
  enabled: true
  uid: dfa4opgnfgg00e        # referenced by the patient dashboards
  url: http://influxdb-service.influx.svc.cluster.local:8086
  bucket: measurements
  token: dev-influx-token    # matches influxdb initSetup.token

# Created from observability/dashboards (see gitops/local/README.md)
extraDashboardsConfigMap: grafana-patient-dashboards
