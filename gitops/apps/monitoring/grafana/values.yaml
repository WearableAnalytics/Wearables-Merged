image:
  repository: grafana/grafana
  tag: "12.3.2"
  imagePullPolicy: IfNotPresent
container:
  port: 3000
resourceRequests:
  cpu: 1
  mem: 2Gi
persistence:
  storage: 1Gi
  storageClassName: cinder-csi
  accessModes: ["ReadWriteOnce"]
ingress: 
  host: "wearables.charite.de"
  prefix: "/grafana"
  httpOnly: false
  authMiddleware: "grafana-admin-auth"
  forwardAuthUrl: "http://wearables-bff.wearables-bff.svc.cluster.local:3001/api/admin/forward-auth"
certificate:
  name: wearables-cert
  secretName: wearables-tls
security:
  csrfTrustedOrigins: "http://localhost:3002,https://wearables.charite.de"

# Provisioned datasource (templates/provisioning.yaml). The uid matches the
# datasource the existing dashboards already reference.
prometheus:
  datasourceUid: ffct924rz8flsa
  url: http://prometheus-service.prometheus.svc.cluster.local

# Path Grafana serves itself under; empty uses ingress.prefix. Set it to the
# grafana-proxy prefix (/proxy) when dashboards are embedded through the proxy.
server:
  subPath: ""

# Optional InfluxDB datasource (InfluxQL) for the patient dashboards, which
# reference it by uid.
influxDatasource:
  enabled: false
  uid: ""
  url: ""
  bucket: ""
  token: ""

# Optional ConfigMap with more dashboard JSON files, shown in the folder "Wearables".
extraDashboardsConfigMap: ""
