apiVersion: v2
name: my-seaweedfs # Umbrella Chart pattern
description: A SeaweedFS Helm chart for Kubernetes
type: application
appVersion: "3.59.0"

# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.2.0

#tells Helm to download the official SeaweedFS chart and put it inside deployment
dependencies:
  - name: seaweedfs
    version: "3.59" 
    repository: https://seaweedfs.github.io/seaweedfs/helm
