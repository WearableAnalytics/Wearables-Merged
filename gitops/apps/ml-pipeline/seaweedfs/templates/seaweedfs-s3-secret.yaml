{{- $adminKey := "hAq6COyoA8DMWJkH" -}}
{{- $readKey := "qPH8JS2yz%$3K7wxUi2!" -}}
{{- $lakefsKey := "501QUn9ETMv2tu9V" -}}

apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-secret
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "admin",
              "secretKey": {{ $adminKey | quote }}
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "readonly",
          "credentials": [
            {
              "accessKey": "readonly",
              "secretKey": {{ $readKey | quote }}
            }
          ],
          "actions": ["Read", "List"]
        },
        {
          "name": "lakefs",
          "credentials": [
            {
              "accessKey": "lakefs",
              "secretKey": {{ $lakefsKey | quote }}
            }
          ],
          "actions": ["Read", "Write", "List", "Tagging"]
        }
      ]
    }