image:
  tag: "3.59"

volume:
  enabled: true
  replicas: 1 # scale this up for production
  maxVolumes: "1"
  data:
    type: "persistentVolumeClaim"
    size: 5Gi
    storageClass: cinder-csi

filer:
  enabled: true
  replicas: 1
  s3:
    enabled: true 

# S3 Gateway for API Spark
s3:
  enabled: true
  replicas: 1
  port: 8333
  
  # auth:
  #   enabled: true
  #   existingSecret: "seaweedfs-s3-secret" 

master:
  enabled: true
  replicas: 1

# global:
#   storageClass: "standard" # ensure Filer and Master have persistent storage

