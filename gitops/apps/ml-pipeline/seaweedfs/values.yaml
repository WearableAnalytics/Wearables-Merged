# Configuration for the Upstream SeaweedFS Chart
# Everything under 'seaweedfs:' is passed to the dependency.
seaweedfs:
  image:
    tag: "3.59"

  volume:
    enabled: true
    replicas: 2
    data:
      type: "persistentVolumeClaim" # automatic PVC creation
      storageClass: cinder-csi
      size: 40Gi
    # Logs go to the container output (kubectl logs), not to the node disk.
    logs:
      type: "none"

  filer:
    enabled: true
    replicas: 1
    # Metadata is in prod-postgres (see WEED_POSTGRES_* below), so the filer
    # needs no local data directory and no hostPath on the node disk.
    data:
      type: "none"
    logs:
      type: "none"
    s3:
      enabled: true
    extraEnvironmentVars:
      # Disable MySQL and LevelDB2, and enable Postgres for metadata storage
      WEED_MYSQL_ENABLED: "false"
      WEED_LEVELDB2_ENABLED: "false"
      WEED_POSTGRES_ENABLED: "true"
      # Postgres connection settings - these should match the configuration of our Postgres Prod instance
      WEED_POSTGRES_HOSTNAME: "prod-postgres.prod-postgres.svc.cluster.local"
      WEED_POSTGRES_PORT: "5432"
      WEED_POSTGRES_DATABASE: "seaweedfs"
      WEED_POSTGRES_SSLMODE: "disable" # it needs to be disabled because our Postgres does not have SSL configured yet
    
    secretExtraEnvironmentVars:
      WEED_POSTGRES_USERNAME:
        secretKeyRef:
          name: seaweedfs-s3-secret
          key: WEED_POSTGRES_USERNAME
      WEED_POSTGRES_PASSWORD:
        secretKeyRef:
          name: seaweedfs-s3-secret
          key: WEED_POSTGRES_PASSWORD
  s3:
    enabled: true
    replicas: 1
    port: 8333
    logs:
      type: "none"
    enableAuth: true
    existingConfigSecret: "seaweedfs-s3-secret"

  master:
    enabled: true
    replicas: 1
    # Raft state on a small Cinder volume instead of a hostPath on the node disk.
    data:
      type: "persistentVolumeClaim"
      storageClass: cinder-csi
      size: 1Gi
    logs:
      type: "none"
