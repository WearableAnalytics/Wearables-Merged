apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-setup-script
  namespace: prod-postgres
data:
  setup.sql: |
    -- Create LakeFS User if not exists
    DO $$ 
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_user WHERE usename = 'lakefs_user') THEN
        CREATE USER lakefs_user WITH PASSWORD 'LAKEFS_PASSWORD_PLACEHOLDER';
      END IF;
    END $$;

    -- Create SeaweedFS User if not exists
    DO $$ 
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_user WHERE usename = 'seaweedfs_user') THEN
        CREATE USER seaweedfs_user WITH PASSWORD 'SEAWEEDFS_PASSWORD_PLACEHOLDER';
      END IF;
    END $$;

    -- Databases (Note: CREATE DATABASE cannot run inside a transaction block/DO block)
    -- These may show an error if they exist, which is fine.
    SELECT 'CREATE DATABASE lakefs' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'lakefs')\gexec
    SELECT 'CREATE DATABASE seaweedfs' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'seaweedfs')\gexec

    -- Schema Permissions for LakeFS
    \c lakefs
    GRANT ALL PRIVILEGES ON DATABASE lakefs TO lakefs_user;
    GRANT ALL ON SCHEMA public TO lakefs_user;

    -- Create Feast User if not exists
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_user WHERE usename = 'feast_user') THEN
        CREATE USER feast_user WITH PASSWORD 'FEAST_PASSWORD_PLACEHOLDER';
      END IF;
    END $$;

    SELECT 'CREATE DATABASE feast' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'feast')\gexec

    -- Create MLflow User if not exists
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_user WHERE usename = 'mlflow_user') THEN
        CREATE USER mlflow_user WITH PASSWORD 'MLFLOW_PASSWORD_PLACEHOLDER';
      END IF;
    END $$;

    SELECT 'CREATE DATABASE mlflow' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'mlflow')\gexec

    -- Schema Permissions for MLflow
    \c mlflow
    GRANT ALL PRIVILEGES ON DATABASE mlflow TO mlflow_user;
    GRANT ALL ON SCHEMA public TO mlflow_user;

    -- Schema Permissions for Feast
    \c feast
    GRANT ALL PRIVILEGES ON DATABASE feast TO feast_user;
    GRANT ALL ON SCHEMA public TO feast_user;

    -- Schema Permissions for SeaweedFS
    \c seaweedfs
    GRANT ALL PRIVILEGES ON DATABASE seaweedfs TO seaweedfs_user;
    GRANT ALL ON SCHEMA public TO seaweedfs_user;

    -- Create SeaweedFS Table
    CREATE TABLE IF NOT EXISTS filemeta (
      dirhash   BIGINT NOT NULL,
      name      VARCHAR(766) NOT NULL,
      directory TEXT NOT NULL,
      meta      BYTEA,
      PRIMARY KEY (dirhash, name)
    );
    CREATE INDEX IF NOT EXISTS idx_directory ON filemeta (directory);
    ALTER TABLE filemeta OWNER TO seaweedfs_user;