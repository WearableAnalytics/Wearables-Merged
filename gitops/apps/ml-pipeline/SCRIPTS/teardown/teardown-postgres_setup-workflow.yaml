apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: postgres-teardown-
  namespace: prod-postgres
spec:
  entrypoint: teardown-job
  templates:
  - name: teardown-job
    script:
      image: postgres:alpine
      command: [sh]
      env:
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-setup-secrets
            key: PGPASSWORD
      - name: PGHOST
        value: "prod-postgres" 
      - name: PGUSER
        value: "postgres"
      source: |
        set -e # Exit immediately if a command exits with a non-zero status

        # Write the SQL to a file
        cat << 'EOF' > teardown.sql
        -- Disconnect users from the databases before dropping
        -- (Connect to the default 'postgres' database first to run these)
        \c postgres

        SELECT pg_terminate_backend(pid) 
        FROM pg_stat_activity 
        WHERE datname IN ('lakefs', 'seaweedfs', 'feast', 'mlflow') 
          AND pid <> pg_backend_pid();

        -- Drop Databases
        -- Note: Dropping the database automatically drops the schemas, tables, and grants.
        DROP DATABASE IF EXISTS lakefs;
        DROP DATABASE IF EXISTS seaweedfs;
        DROP DATABASE IF EXISTS feast;
        DROP DATABASE IF EXISTS mlflow;

        -- Drop Users
        -- Note: Users cannot be dropped if they still own objects or have privileges.
        DROP USER IF EXISTS lakefs_user;
        DROP USER IF EXISTS seaweedfs_user;
        DROP USER IF EXISTS feast_user;
        DROP USER IF EXISTS mlflow_user;
        EOF

        # Actually execute the SQL file we just created against the database
        echo "Executing teardown.sql..."
        psql -f teardown.sql