# Template for the Infisical Machine Identity credentials.
# Copy this to operator-auth-secret.yaml (gitignored) and fill in the values.
#
# How to get these values:
#   1. Open the Infisical UI (kubectl port-forward svc/infisical -n infisical 8080:80)
#   2. Go to Organization Settings > Machine Identities > Create Identity (name: k8s-operator)
#   3. Add Universal Auth method -- copy the clientId and clientSecret below
#   4. Grant the identity access to the ml-pipeline project (production environment)
apiVersion: v1
kind: Secret
metadata:
  name: infisical-machine-identity
  namespace: infisical
type: Opaque
stringData:
  clientId: "<clientId from Infisical UI>"
  clientSecret: "<clientSecret from Infisical UI>"
