# it true kafka controller and broker are run together, if false they are run separately (and each use a pvc)
enableDualRole: true

kafka:
  metadataVersion: 4.1-IV1
  version: 4.1.0
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    - name: tls
      port: 9093
      type: internal
      tls: true
    - name: bench
      port: 9094
      type: internal
      tls: false
      configuration:
        brokers:
          - broker: 0
            advertisedHost: localhost
            advertisedPort: 19092

kafkaNodePools:
  replicas: 3
  volume:
    size: 5Gi

storageClassName: local-path # may need to be changed

dualRole:
  resources:
      requests:
        cpu: 4
        memory: 4Gi 
      limits:
        cpu: 6
        memory: 6Gi

controllerName: k-controller
brokerName: k-broker

topics:
  - name: dlq
    partitions: 1 
    replicas: 1
    retentionMs: 7200000 #2 hours, should be tweaked as needed
    segmentBytes: 1073741824 # 1 GiB
  - name: wearables-lp
    partitions: 9
    replicas: 3
    retentionMs: 43200000
    segmentBytes: 1073741824
  - name: wearables-raw
    partitions: 30
    replicas: 3
    retentionMs: 7200000
    segmentBytes: 1073741824


