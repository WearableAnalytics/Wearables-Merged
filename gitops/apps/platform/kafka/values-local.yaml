# Local minikube: one broker, small footprint.
kafkaNodePools:
  replicas: 1          # Prod: 3
  volume:
    size: 2Gi          # Prod: 5Gi

storageClassName: standard   # Minikube's default class (Prod: local-path)

dualRole:
  resources:
    requests:
      cpu: 250m        # Prod: 4
      memory: 1Gi      # Prod: 4Gi
    limits:
      cpu: "1"         # Prod: 6
      memory: 1536Mi   # Prod: 6Gi

topics:                # same as Prod, but one replica each
  - name: dlq
    partitions: 1
    replicas: 1
    retentionMs: 7200000
    segmentBytes: 1073741824
  - name: wearables-lp
    partitions: 9
    replicas: 1        # Prod: 3
    retentionMs: 43200000
    segmentBytes: 1073741824
  - name: wearables-raw
    partitions: 30
    replicas: 1        # Prod: 3
    retentionMs: 7200000
    segmentBytes: 1073741824

sourceConnector:
  enabled: false       # Prod: true (to be checked); no Kafka Connect or Mosquitto locally
