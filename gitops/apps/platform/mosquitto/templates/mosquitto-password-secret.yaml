apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-passwords"
type: Opaque
stringData:
  # Mosquitto password file format: one entry per line → username:bcrypt_hash
  # Generate with: mosquitto_passwd -c /tmp/passwords <username>
  # Or use the bootstrap-runtime-secrets.sh script to auto-generate and inject.
  # REQUIRED — override via Helm --set or a values override file before deploying.
  passwords: {{ .Values.mosquitto.passwordFileContent | required "mosquitto.passwordFileContent must be set — generate with mosquitto_passwd" | quote }}
