apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mongodb-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.auth.username }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.auth.password }}
  MONGO_INITDB_DATABASE: {{ .Values.mongodb.auth.database }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  ENCRYPTION_KEY: {{ .Values.infisical.encryptionKey }}
  JWT_AUTH_SECRET: {{ .Values.infisical.jwtAuthSecret }}
  JWT_REFRESH_SECRET: {{ .Values.infisical.jwtRefreshSecret }}
  JWT_SERVICE_SECRET: {{ .Values.infisical.jwtServiceSecret }}
  MONGO_URL: "mongodb://{{ .Values.mongodb.auth.username }}:{{ .Values.mongodb.auth.password }}@{{ .Release.Name }}-mongodb:27017/{{ .Values.mongodb.auth.database }}?authSource=admin"
