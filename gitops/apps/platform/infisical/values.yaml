replicaCount: 1

image:
  repository: infisical/infisical
  pullPolicy: Always
  tag: "latest"

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "6.0"
  storageSize: 10Gi
  storageClassName: local-path
  auth:
    # MongoDB connection string will be used by Infisical
    database: infisical
    username: infisical
    password: infisical-password

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  # Redis läuft im Memory-Only Modus ohne PVC (als Cache)
  persistence:
    enabled: false

infisical:
  # Infisical configuration
  siteUrl: "https://infisical.wearable-analytics.de"
  encryptionKey: "change-this-to-a-secure-random-32-char-key"
  jwtAuthSecret: "change-this-to-a-secure-random-key"
  jwtRefreshSecret: "change-this-to-a-secure-refresh-key"
  jwtServiceSecret: "change-this-to-a-secure-service-key"

service:
  type: ClusterIP
  port: 8080
  nodePort: 30080

ingress:
  enabled: false
  host: infisical.wearable-analytics.de
  certIssuer: letsencrypt-prod
