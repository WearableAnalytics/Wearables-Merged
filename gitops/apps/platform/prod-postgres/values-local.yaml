# Local minikube: small volume and footprint, local-only passwords. The admin
# password (postgres) is in prod-postgres-secret, created by gitops/local/setup-local.sh.
databases:                     # Prod also creates lakefs (ML pipeline, not part of the local core)
  - name: dblord
    user: dblord
    password: dblord           # local only

resources:
  requests:
    cpu: 100m                  # Prod: 250m
    memory: 256Mi              # Prod: 512Mi
  limits:
    cpu: 500m                  # Prod: 1000m
    memory: 512Mi              # Prod: 2Gi

storage:
  size: 2Gi                    # Prod: 20Gi
  storageClassName: standard   # Prod: cinder-csi
