# Existing secret with the admin password (key POSTGRES_PASSWORD). The chart never
# creates it: production: scripts/bootstrap-runtime-secrets.sh, locally:
# gitops/local/setup-local.sh. Postgres only reads it when the volume is empty.
auth:
  secretName: prod-postgres-secret

databases:
  - name: dblord
    user: dblord
    password: k052oFSjXuDZjiYcweA5lAb2
  - name: lakefs
    user: lakefs_user
    password: "ji5VGo7BeAY3DBWa$Yjb"

image:
  repository: postgres
  tag: 18-alpine
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

service:
  port: 5432
  type: ClusterIP

storage:
  size: 20Gi
  storageClassName: cinder-csi