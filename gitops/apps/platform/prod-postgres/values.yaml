auth:
  postgresPassword: "" # set by setup-script.sh (PROD_POSTGRES_PASSWORD)

databases:
  - name: dblord
    user: dblord
    password: "" # set by setup-script.sh
  - name: lakefs
    user: lakefs_user
    password: "" # set by setup-script.sh

image:
  repository: postgres
  tag: 18-alpine
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

service:
  port: 5432
  type: ClusterIP

storage:
  size: 20Gi
  storageClassName: cinder-csi # Cinder volume; survives node replacement