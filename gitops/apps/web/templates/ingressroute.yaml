{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ .Release.Name }}-https"
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/assets`)"
      kind: Rule
      priority: 100
      services:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}

    - match: "Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/`)"
      kind: Rule
      priority: 1
      services:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
  tls:
    secretName: {{ .Values.certificate.secretName }}
{{- end }}
