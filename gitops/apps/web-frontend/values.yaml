image:
  # Built by .github/workflows/publish-images.yml
  repository: ghcr.io/wearableanalytics/wearables-web
  tag: "latest"
  pullPolicy: Always

runtimeConfigMap:
  create: true
  name: ""

runtimeConfig:
  apiBaseUrl: "/api"
  grafanaProxyUrl: "/proxy"

# Service configuration
service:
  port: 80
  targetPort: 80

# Ingress configuration
ingress:
  enabled: true
  host: "wearables.charite.de"
  path: "/"
  httpOnly: false
  certificateSecretName: "wearables-tls"

# Resource requests and limits
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Replica count
replicaCount: 1
