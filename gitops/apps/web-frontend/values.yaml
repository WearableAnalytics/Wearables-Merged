image:
  repository: wearables42/web-frontend
  tag: "1.0.0"
  pullPolicy: Always

runtimeConfigMap:
  create: true
  name: ""

runtimeConfig:
  # Leave empty to auto-derive from ingress.host (recommended).
  # Override only if API/socket live on a different domain.
  apiBaseUrl: ""
  grafanaProxyUrl: ""
  socketUrl: ""

# Service configuration
service:
  port: 80
  targetPort: 80

# Ingress configuration
ingress:
  enabled: true
  host: "wearables.charite.de"
  path: "/"
  certificateSecretName: "wearables-tls"

# Resource requests and limits
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Replica count
replicaCount: 1
