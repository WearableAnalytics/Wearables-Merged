image:
  repository: wearables42/wearables-web-frontend
  tag: "latest"
  pullPolicy: Always

runtimeConfigMap:
  create: true
  name: ""

runtimeConfig:
  apiBaseUrl: "http://wearables.charite.de/"
  grafanaProxyUrl: "http://wearables.charite.de/proxy"

# Service configuration
service:
  port: 80
  targetPort: 80

# Ingress configuration
ingress:
  enabled: true
  host: "wearables.charite.de"
  path: "/"
  httpOnly: true
  certificateSecretName: "wearables-tls"

# Resource requests and limits
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Replica count
replicaCount: 1
