{{- $runtimeConfigMapName := default (printf "%s-runtime-config" .Release.Name) .Values.runtimeConfigMap.name -}}
{{- if .Values.runtimeConfigMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $runtimeConfigMapName }}
  labels:
    app: {{ .Release.Name }}
data:
  runtime-config.js: |
    window.__APP_CONFIG__ = {
      API_BASE_URL: {{ default (printf "https://%s/api" .Values.ingress.host) .Values.runtimeConfig.apiBaseUrl | quote }},
      GRAFANA_PROXY_URL: {{ default (printf "https://%s/grafana-proxy" .Values.ingress.host) .Values.runtimeConfig.grafanaProxyUrl | quote }},
      SOCKET_URL: {{ default (printf "https://%s" .Values.ingress.host) .Values.runtimeConfig.socketUrl | quote }}
    };
{{- end }}
