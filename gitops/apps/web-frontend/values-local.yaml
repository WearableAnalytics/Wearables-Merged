# Local minikube: image built into minikube, served at http://wearables.localhost.
image:
  repository: wearables-local/web
  tag: dev
  pullPolicy: Never           # use the image built into minikube

runtimeConfig:                # relative paths, same as the Docker Compose stack
  apiBaseUrl: "/api"          # Prod (setup script): http://wearables.charite.de/api
  grafanaProxyUrl: "/proxy"   # grafana-proxy follows in a later step

ingress:
  host: wearables.localhost   # Prod: wearables.charite.de
