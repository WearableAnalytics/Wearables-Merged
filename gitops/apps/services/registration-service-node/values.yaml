replicaCount: 1

image:
  repository: gmsdaniil/wearables-registration-service-node
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 3001

env:
  PORT: "3001"
  API_PREFIX: "/api"
  USE_MOCK_DATA: "false"
  NODE_ENV: "production"

frontendOrigins: "http://localhost:8080,http://localhost:8081"

adminEmails: ""

secretRef: "registration-service-node-secrets"

