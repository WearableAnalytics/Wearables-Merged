apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretRef }}
type: Opaque
stringData:
  # Replace the following with your actual secrets
  DATABASE_API_URL: "http://db-lord.db-lord.svc.cluster.local:8080"
  JWT_SECRET: "dev-secret"
  {{- if .Values.frontendOrigins }}
  FRONTEND_URL: {{ .Values.frontendOrigins | quote }}
  {{- end }}
  {{- if .Values.adminEmails }}
  ADMIN_EMAILS: {{ .Values.adminEmails | quote }}
  {{- end }}
  MAILER_ENABLED: "true"
  MAILER_FROM_NAME: "Wearables Platform"
  MAILER_FROM_EMAIL: "email@example.com"
  BREVO_API_KEY: "token"
