apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.mapperEnvConfigMap }}
data:
  KAFKA_BROKER_ENV_VAR: {{ .Values.envs.brokerEnv }}
  APP_ID: {{ .Values.envs.appId }}
  MAPPING_YAML_PATH: {{ .Values.envs.fhirMappingYamlPath }}
  INPUT_TOPIC: {{ .Values.envs.inputTopic }}
  OUTPUT_TOPIC: {{ .Values.envs.outputTopic }}
  DLQ_TOPIC: {{ .Values.envs.dlqTopic }}
  PARTITION_THREADS: {{ .Values.envs.partitionThreads | quote }}