replicaCount: 1

image:
  # Built by .github/workflows/publish-images.yml. Pin a commit SHA tag at
  # deploy time (--set image.tag=<sha>) instead of relying on latest.
  repository: ghcr.io/wearableanalytics/wearables-db-lord
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

secretRef: "db-lord-secrets"

env:
  POSTGRES_SERVER: "prod-postgres.prod-postgres.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "dblord"
  POSTGRES_USER: "dblord"
  POSTGRES_PASSWORD: "password"

  INFLUX_URL: "http://influxdb-service.influx.svc.cluster.local:8086"
  INFLUX_ORG: "wearables-project"
  INFLUX_BUCKET: "measurements"
  INFLUX_TOKEN: "token"