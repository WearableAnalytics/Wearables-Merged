replicaCount: 1

image:
  # Built by .github/workflows/publish-images.yml. Pin a commit SHA tag at
  # deploy time (--set image.tag=<sha>) instead of relying on latest.
  repository: ghcr.io/wearableanalytics/wearables-db-lord
  pullPolicy: IfNotPresent
  tag: "latest"

# Port uvicorn listens on inside the image (services/backend/db_lord/Dockerfile).
containerPort: 8000

service:
  type: ClusterIP
  port: 8080

# Existing secret with the connection settings and credentials. The chart never
# creates it: it is created out of band before the install (production:
# scripts/bootstrap-runtime-secrets.sh, locally: gitops/local/setup-local.sh).
# Keys: POSTGRES_SERVER, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD,
#       INFLUX_URL, INFLUX_ORG, INFLUX_BUCKET, INFLUX_TOKEN
secretRef: "db-lord-secrets"
