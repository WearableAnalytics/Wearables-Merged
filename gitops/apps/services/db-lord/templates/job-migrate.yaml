# Runs `alembic upgrade head` before every install and upgrade, with the same
# image as the deployment and the credentials from the existing secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command: ["/app/.venv/bin/alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretRef }}
