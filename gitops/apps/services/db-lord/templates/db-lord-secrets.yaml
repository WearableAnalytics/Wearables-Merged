apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretRef }}
type: Opaque
stringData:
  POSTGRES_SERVER: "{{ .Values.env.POSTGRES_SERVER }}"
  POSTGRES_PORT: "{{ .Values.env.POSTGRES_PORT }}"
  POSTGRES_DB: "{{ .Values.env.POSTGRES_DB }}"
  POSTGRES_USER: "{{ .Values.env.POSTGRES_USER }}"
  POSTGRES_PASSWORD: "{{ .Values.env.POSTGRES_PASSWORD | quote }}"

  INFLUX_URL: "{{ .Values.env.INFLUX_URL }}"
  INFLUX_ORG: "{{ .Values.env.INFLUX_ORG }}"
  INFLUX_BUCKET: "{{ .Values.env.INFLUX_BUCKET }}"
  INFLUX_TOKEN: "{{ .Values.env.INFLUX_TOKEN | quote }}"
