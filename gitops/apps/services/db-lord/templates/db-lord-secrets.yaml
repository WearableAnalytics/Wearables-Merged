{{- /*
The secret holds real credentials that are set once per environment.
If it already exists, its data is kept as-is: the placeholder values in
values.yaml are only used to create it the first time (e.g. on minikube).
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretRef }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if $existing }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
stringData:
  POSTGRES_SERVER: {{ .Values.env.POSTGRES_SERVER | default "" | quote }}
  POSTGRES_PORT: {{ .Values.env.POSTGRES_PORT | default "" | quote }}
  POSTGRES_DB: {{ .Values.env.POSTGRES_DB | default "" | quote }}
  POSTGRES_USER: {{ .Values.env.POSTGRES_USER | default "" | quote }}
  POSTGRES_PASSWORD: {{ .Values.env.POSTGRES_PASSWORD | default "" | quote }}
  INFLUX_URL: {{ .Values.env.INFLUX_URL | default "" | quote }}
  INFLUX_ORG: {{ .Values.env.INFLUX_ORG | default "" | quote }}
  INFLUX_BUCKET: {{ .Values.env.INFLUX_BUCKET | default "" | quote }}
  INFLUX_TOKEN: {{ .Values.env.INFLUX_TOKEN | default "" | quote }}
{{- end }}
