replicaCount: 1

image:
  # Built by .github/workflows/publish-images.yml. Pin a commit SHA tag at
  # deploy time (--set image.tag=<sha>) instead of relying on latest.
  repository: ghcr.io/wearableanalytics/wearables-extraction-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8010

secretRef: "extraction-service-secrets"

env:
  DB_LORD_BASE_URL: "http://db-lord.db-lord.svc.cluster.local:8080"
