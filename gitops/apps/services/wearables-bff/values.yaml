replicaCount: 1

image:
  # TODO: Move this image to the team/org repository later.
  repository: gmsdaniil/wearables-bff
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 3001

configMap:
  create: true
  name: ""

env:
  PORT: "3001"
  API_PREFIX: "/api"
  USE_MOCK_DATA: "false"
  NODE_ENV: "production"
  FRONTEND_ORIGINS: "http://localhost:8080,http://localhost:8081"
  FRONTEND_REDIRECT_URL: "http://localhost:8080"
  ADMIN_EMAILS: "linus.gustafsson@tu-berlin.de,j.moehler@posteo.de,admin@lukaszsztukiewicz.com,gmsdaniilplay@gmail.com"
  BACKEND_URL: "http://localhost:3001"
  AUTH_SESSION_EXPIRY_SECONDS: "604800"
  MAGIC_LINK_EXPIRY_SECONDS: "900"
  CASE_TOKEN_EXPIRY_SECONDS: "691200"
  TOKEN_ISSUER: "wearables-bff"
  DATABASE_API_URL: "http://db-lord.db-lord.svc.cluster.local:8080"
  DATABASE_API_TIMEOUT: "30000"
  LOG_LEVEL: "info"
  MAILER_FROM_NAME: "Wearables Platform"
  MAILER_FROM_EMAIL: "jmm123@posteo.de"
  COOKIE_SECURE: ""

secret:
  enabled: true
  create: true
  name: ""
  data:
    # REQUIRED — JWT_SECRET injected at deploy time by bootstrap-runtime-secrets.sh.
    # Service crashes on startup in production if this equals "dev-secret" (enforced in config.ts).
    JWT_SECRET: "CHANGE_ME_JWT_SECRET"
    # REQUIRED — Brevo transactional email API key for magic-link delivery.
    BREVO_API_KEY: "CHANGE_ME_BREVO_API_KEY"
    # REQUIRED — Shared secret for researcher API bearer token validation.
    RESEARCHER_API_ACCESS_TOKEN: "CHANGE_ME_RESEARCHER_API_ACCESS_TOKEN"
