replicaCount: 1

image:
  # Built by .github/workflows/publish-images.yml. Pin a commit SHA tag at
  # deploy time (--set image.tag=<sha>) instead of relying on latest.
  repository: ghcr.io/wearableanalytics/wearables-bff
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  host: "wearables.charite.de"
  pathPrefix: "/api"
  httpOnly: false
  certificateSecretName: "wearables-tls"

configMap:
  create: true
  name: ""

env:
  PORT: "3001"
  API_PREFIX: "/api"
  USE_MOCK_DATA: "false"
  NODE_ENV: "production"
  FRONTEND_ORIGINS: "https://wearables.charite.de"
  FRONTEND_REDIRECT_URL: "https://wearables.charite.de/"
  ADMIN_EMAILS: ""
  BACKEND_URL: "https://wearables.charite.de"
  AUTH_SESSION_EXPIRY_SECONDS: "604800"
  MAGIC_LINK_EXPIRY_SECONDS: "900"
  CASE_TOKEN_EXPIRY_SECONDS: "94608000"
  TOKEN_ISSUER: "wearables-bff"
  DATABASE_API_URL: "http://db-lord.db-lord.svc.cluster.local:8080"
  DATABASE_API_TIMEOUT: "30000"
  # Serves the extraction API (with Swagger UI) at /api/extraction for researchers/admins.
  # Leave empty to disable the route.
  EXTRACTION_API_URL: "http://extraction-service.extraction-service.svc.cluster.local:8010"
  LOG_LEVEL: "info"
  MAILER_FROM_NAME: "Wearables Platform"
  MAILER_FROM_EMAIL: "noreply@wearables.charite.de"
  COOKIE_SECURE: "false"

# Existing secret with JWT_SECRET and BREVO_API_KEY (needed when NODE_ENV is
# production). Created out of band (production: scripts/bootstrap-runtime-secrets.sh,
# locally: gitops/local/setup-local.sh), so real values never come from git.
secret:
  enabled: true
  create: false
  name: "wearables-bff-secrets"
  data: {}
