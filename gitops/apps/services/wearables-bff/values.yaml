replicaCount: 1

image:
  repository: gmsdaniil/wearables-bff
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 3001

configMap:
  create: true
  name: ""

env:
  PORT: "3001"
  API_PREFIX: "/api"
  USE_MOCK_DATA: "true"
  NODE_ENV: "development"
  FRONTEND_URL: "http://localhost:8080,http://localhost:8081"
  ADMIN_EMAILS: "test@test.de"
  BACKEND_URL: ""
  DATABASE_API_URL: "http://db-lord.db-lord.svc.cluster.local:8080"
  DATABASE_API_TIMEOUT: "30000"
  LOG_LEVEL: "info"
  MAILER_ENABLED: "false"
  MAILER_FROM_NAME: "Wearables Platform"
  MAILER_FROM_EMAIL: "email@example.com"
  COOKIE_SECURE: ""

secret:
  enabled: true
  create: false
  name: ""
  data:
    JWT_SECRET: "change-me"
    BREVO_API_KEY: ""
    RESEARCHER_API_ACCESS_TOKEN: ""
