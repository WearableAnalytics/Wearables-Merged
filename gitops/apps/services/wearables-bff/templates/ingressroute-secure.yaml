{{- if and .Values.ingress.enabled (not .Values.ingress.httpOnly) }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ .Release.Name }}-https"
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ .Values.ingress.host }}`) && PathPrefix(`{{ .Values.ingress.pathPrefix }}`)"
      kind: Rule
      middlewares:
        - name: {{ .Release.Name }}-dedupe-api
      services:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
  tls:
    secretName: {{ .Values.ingress.certificateSecretName }}
{{- end }}