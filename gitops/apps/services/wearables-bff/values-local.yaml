# Local minikube: development mode, plain HTTP under wearables.localhost.
image:
  repository: wearables-local/wearables-bff
  tag: dev
  pullPolicy: Never                 # use the image built into minikube

ingress:
  host: wearables.localhost         # Prod: wearables.charite.de
  httpOnly: true

env:
  NODE_ENV: development             # Prod: production; login without magic-link mail
  FRONTEND_ORIGINS: "http://wearables.localhost"
  FRONTEND_REDIRECT_URL: "http://wearables.localhost/"
  BACKEND_URL: "http://wearables.localhost"
  ADMIN_EMAILS: "admin@example.com" # local admin login
# secret.data.JWT_SECRET keeps the chart default "dev-secret", matching importservice
