{{- if not .Values.ingress.httpOnly }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ .Release.Name }}-https"
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`{{ .Values.ingress.host }}`) && PathPrefix(`{{ .Values.ingress.prefix }}`)"
      kind: Rule
      middlewares:
        - name: cloud-rewrite-path
      services:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
          serversTransport: ingress-long-timeout@kubernetescrd
  tls:
    secretName: {{ .Values.certificate.secretName }}
{{- end }}
