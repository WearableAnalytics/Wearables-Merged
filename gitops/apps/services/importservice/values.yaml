replicaCount: 1

image:
  # Built by .github/workflows/publish-images.yml. Pin a commit SHA tag at
  # deploy time (--set image.tag=<sha>) instead of relying on latest.
  repository: ghcr.io/wearableanalytics/wearables-importservice
  tag: "" # Required: published commit SHA; or set digest below.
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

env:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC: "wearables-raw"
  KAFKA_RESULTS_TOPIC: "wearables-ingestion-results"
  KAFKA_OUTPUT_TOPIC: "wearables-lp"
  KAFKA_RESULTS_GROUP: "reliable-ingestion-results-v1"
  KAFKA_CLIENT_ID: "import-service"
  KAFKA_DELIVERY_TIMEOUT_MS: "10000"
  JWT_ISSUER: "wearables-bff"
  INGEST_ARCHIVE_KEY_ID: "initial"
  INGEST_MAX_BODY_BYTES: "500000"
  INGEST_MAX_READINGS: "1000"
  INGEST_MAX_INFLIGHT: "16"
  INFLUXDB_URL: "http://influxdb-service.influx.svc.cluster.local:8086"
  INFLUXDB_ORG: "wearables-project"
  INFLUXDB_BUCKET: "measurements"

# JWT_SECRET comes from an existing Secret (created out of band, never in git).
jwtSecret:
  secretName: importservice-secrets
  key: JWT_SECRET

# All Secrets must already exist in the release namespace. No secret values in Helm.
runtimeSecret:
  name: importservice-ingestion
  databaseKey: INGEST_DATABASE_URL
  archiveKey: INGEST_ARCHIVE_KEY
  archiveOldKeysKey: INGEST_ARCHIVE_OLD_KEYS # Optional; JSON map of retained old keys.
  influxTokenKey: INFLUXDB_TOKEN # Bucket READ token, separate from Telegraf's writer.

# A Secret with the same signing value must exist in the mapper namespace.
signingSecret:
  name: ingestion-signing
  key: INGEST_SIGNING_KEY

kafkaSecuritySecret:
  name: "" # Optional Python Kafka TLS/SASL JSON; TLS certificates can be mounted below.
  key: KAFKA_SECURITY_JSON

migration:
  enabled: true
  secretName: importservice-migration # Must differ from runtimeSecret.name.
  databaseKey: INGEST_DATABASE_URL
  runtimeRole: wearables_ingest # Existing unprivileged PostgreSQL LOGIN role.
  activeDeadlineSeconds: 300
  extraVolumes: []
  extraVolumeMounts: []

extraVolumes: []
extraVolumeMounts: []
resources: {}

# Prometheus request metrics, served on a separate port so they are not
# reachable through the public /import route. Scraped by the prometheus chart.
metrics:
  port: 9102

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 80

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  enabled: true
  path: /ready
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  host: "wearables.charite.de"
  prefix: "/import"
  httpOnly: false
  regex: "^/import/?(.*)"
  replacement: /$1
  certificateSecret: wearables-tls

certificate:
  name: wearables-cert
  secretName: wearables-tls

