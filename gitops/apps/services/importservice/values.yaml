replicaCount: 1

image:
  # Built by .github/workflows/publish-images.yml. Pin a commit SHA tag at
  # deploy time (--set image.tag=<sha>) instead of relying on latest.
  repository: ghcr.io/wearableanalytics/wearables-importservice
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

env:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC: "wearables-raw"
  JWT_ISSUER: "wearables-bff"

# JWT_SECRET comes from an existing Secret (created out of band, never in git).
jwtSecret:
  secretName: importservice-secrets
  key: JWT_SECRET

# Prometheus request metrics, served on a separate port so they are not
# reachable through the public /import route. Scraped by the prometheus chart.
metrics:
  port: 9102

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 80

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  host: "wearables.charite.de"
  prefix: "/import"
  httpOnly: false
  regex: "^/import/?(.*)"
  replacement: /$1
  certificateSecret: wearables-tls

certificate:
  name: wearables-cert
  secretName: wearables-tls

