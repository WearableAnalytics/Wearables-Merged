replicaCount: 1

image:
  repository: gmsdaniil/wearables-ingestion
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

env:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC: "wearables-raw"
  # REQUIRED — override via --set or values override file; injected by bootstrap-runtime-secrets.sh.
  # Service crashes on startup if this is missing or empty (enforced in config.py).
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
  JWT_ISSUER: "registration-service"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 80

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  host: "wearables.charite.de"
  prefix: "/import"
  regex: "^/import/?(.*)"
  replacement: /$1
  certificateSecret: wearables-tls

certificate:
  name: wearables-cert
  secretName: wearables-tls

