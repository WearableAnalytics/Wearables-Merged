# Adapter between BayesPlatform and the local model (gitops/apps/bayes-llm).
#
# BayesPlatform's OpenAI-compatible "Mistral Small 3.1" slot calls
#   $VLLM_MISTRALSMALL31_24B_URL/chat/completions
# and always fetches a Google Cloud token first. This gateway
#   - answers the GCE metadata token request with a dummy token
#     (BayesPlatform points GCE_METADATA_HOST here),
#   - forwards /v1/* to UPSTREAM_BASE_URL with UPSTREAM_MODEL.
# The same adapter was used for Clé (branch cle-connection, CLE.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway
  namespace: bayes-platform
data:
  UPSTREAM_BASE_URL: http://ollama.bayes-llm.svc.cluster.local:11434/v1
  UPSTREAM_MODEL: qwen2.5:7b
  server.mjs: |
    import http from 'node:http'

    const base = (process.env.UPSTREAM_BASE_URL ?? '').replace(/\/+$/, '')
    const model = process.env.UPSTREAM_MODEL ?? ''
    const key = process.env.UPSTREAM_API_KEY ?? 'unused'

    function metadata(req, res) {
      res.setHeader('Metadata-Flavor', 'Google')
      if (req.url.includes('/service-accounts/default/token')) {
        res.setHeader('content-type', 'application/json')
        return res.end(JSON.stringify({ access_token: 'llm-gateway', expires_in: 3600, token_type: 'Bearer' }))
      }
      if (req.url.includes('/project/project-id')) return res.end('llm-gateway')
      if (req.url.includes('/service-accounts/default/email')) return res.end('llm-gateway@local')
      res.end('')
    }

    async function forward(req, res) {
      const chunks = []
      for await (const chunk of req) chunks.push(chunk)
      let body = Buffer.concat(chunks)
      // x-llm-model lets a test pick another model; BayesPlatform never sends it.
      const requested = req.headers['x-llm-model'] || model
      if (body.length && requested) {
        const json = JSON.parse(body.toString('utf8'))
        json.model = requested
        body = Buffer.from(JSON.stringify(json))
      }
      const target = base + req.url.replace(/^\/v1/, '')
      try {
        const upstream = await fetch(target, {
          method: req.method,
          headers: { 'content-type': 'application/json', authorization: `Bearer ${key}` },
          body: req.method === 'GET' ? undefined : body,
        })
        res.writeHead(upstream.status, {
          'content-type': upstream.headers.get('content-type') ?? 'application/json',
        })
        if (!upstream.body) return res.end()
        for await (const chunk of upstream.body) res.write(chunk)
        res.end()
        console.log(`${req.method} ${req.url} -> ${upstream.status}`)
      } catch (error) {
        console.log(`${req.method} ${req.url} -> error ${error.cause?.code ?? error.message}`)
        res.writeHead(502, { 'content-type': 'application/json' })
        res.end(JSON.stringify({ error: { message: `LLM unreachable: ${error.cause?.code ?? error.message}` } }))
      }
    }

    http
      .createServer((req, res) => {
        if (req.url === '/healthz') return res.end('ok')
        if (req.url.startsWith('/computeMetadata')) return metadata(req, res)
        if (req.url.startsWith('/v1/')) return void forward(req, res)
        res.writeHead(404).end()
      })
      .listen(8080, () => console.log('llm-gateway on :8080'))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: bayes-platform
  labels:
    app: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      nodeSelector:
        workload: bayes
      containers:
        - name: gateway
          image: node:24-slim
          command: ["node", "/srv/server.mjs"]
          envFrom:
            - configMapRef:
                name: llm-gateway
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          volumeMounts:
            - name: code
              mountPath: /srv
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: code
          configMap:
            name: llm-gateway
            items: [{ key: server.mjs, path: server.mjs }]
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: bayes-platform
spec:
  selector:
    app: llm-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
