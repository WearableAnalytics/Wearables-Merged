# BayesPlatform (github.com/bayesimpact/bayes-platform), self-contained install
# next to the wearables platform:
#   helm upgrade --install bayes-platform oci://ghcr.io/bayesimpact/charts/bayes-platform \
#     --version 26.9.4 -n bayes-platform -f values.yaml
# Secrets live in the bayes-platform-secrets Secret, created out of band (README).
# Not usable yet: no OIDC provider, no LLM, no Vertex embeddings, no ingress.

global:
  image:
    # Current main: generic OIDC login landed after the 26.09.4 release.
    tag: "sha-39bc9f1"

# Reached through port-forward for now (no public hostname yet):
#   kubectl -n bayes-platform port-forward svc/bayes-platform-api 8181:3000
#   kubectl -n bayes-platform port-forward svc/keycloak 8180:8080
urls:
  api: http://localhost:8181
  web: http://localhost:8181
  webEmbed: http://localhost:8182
  help: http://localhost:8183

secrets:
  existingSecret: bayes-platform-secrets

config:
  # Temporary in-namespace Keycloak (keycloak.yaml). The issuer is the
  # port-forward URL; the API pod reaches it through a sidecar (post-render/).
  OIDC_ISSUER_URL: http://localhost:8180/realms/platform
  ORGANIZATION_CREATOR_EMAIL_DOMAIN: "@charite.de"
  BACKOFFICE_AUTHORIZED_DOMAIN: "@charite.de"
  BACKOFFICE_AUTHORIZED_EMAILS: "elias.gruenewald@charite.de"
  BULL_BOARD_ALLOWED_EMAIL_DOMAIN: "@charite.de"

postgresql:
  persistence:
    storageClass: cinder-csi

redis:
  persistence:
    storageClass: cinder-csi

# Cinder volumes are ReadWriteOnce, so the API and the workers that share the
# document volume are pinned to one node: the dedicated bayes-node (Kubermatic
# MachineDeployment `bayes-node`, flavor de.NBI small: 8 vCPU / 16 GB,
# 100 GB root disk). The other
# nodes only have 19 GB disks, too small for these images.
storage:
  local:
    storageClass: cinder-csi
    accessModes: ["ReadWriteOnce"]
    size: 20Gi

api:
  replicas: 1
  nodeSelector:
    workload: bayes

cpuWorkers:
  replicas: 1
  nodeSelector:
    workload: bayes

ingress:
  enabled: false
