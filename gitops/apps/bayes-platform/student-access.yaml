# Cluster access for the Bayes student: port-forward to BayesPlatform and read
# its pods and logs, nothing outside the bayes-platform namespace (no patient
# data namespaces). The token lives in the Secret below; deleting it revokes the
# kubeconfig. The kubeconfig itself is built out of band, never in the repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bayes-student
  namespace: bayes-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: bayes-student-token
  namespace: bayes-platform
  annotations:
    kubernetes.io/service-account.name: bayes-student
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bayes-student
  namespace: bayes-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bayes-student
  namespace: bayes-platform
subjects:
  - kind: ServiceAccount
    name: bayes-student
    namespace: bayes-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bayes-student
