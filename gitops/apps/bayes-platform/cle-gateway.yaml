# Test shim: lets BayesPlatform use Clé (Charité's OpenAI-compatible LLM)
# without changing BayesPlatform's code.
#
# BayesPlatform's OpenAI-compatible "Mistral Small 3.1" slot calls
#   $VLLM_MISTRALSMALL31_24B_URL/chat/completions
# with a Google Cloud access token. This gateway
#   - answers the GCE metadata token request with a dummy token
#     (BayesPlatform points GCE_METADATA_HOST here),
#   - forwards /v1/* to CLE_BASE_URL with the Clé key and CLE_MODEL.
# Replace with a proper provider in BayesPlatform once Clé works.
#
# Secret (created by Elias, never in the repo): cle-api / CLE_API_KEY.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cle-gateway
  namespace: bayes-platform
data:
  CLE_BASE_URL: https://cle.charite.de/api
  CLE_MODEL: eu # Mistral
  server.mjs: |
    import http from 'node:http'

    const base = (process.env.CLE_BASE_URL ?? '').replace(/\/+$/, '')
    const model = process.env.CLE_MODEL ?? ''
    const key = process.env.CLE_API_KEY ?? ''

    function metadata(req, res) {
      res.setHeader('Metadata-Flavor', 'Google')
      if (req.url.includes('/service-accounts/default/token')) {
        res.setHeader('content-type', 'application/json')
        return res.end(JSON.stringify({ access_token: 'cle-gateway', expires_in: 3600, token_type: 'Bearer' }))
      }
      if (req.url.includes('/project/project-id')) return res.end('cle-gateway')
      if (req.url.includes('/service-accounts/default/email')) return res.end('cle-gateway@local')
      res.end('')
    }

    async function forward(req, res) {
      const chunks = []
      for await (const chunk of req) chunks.push(chunk)
      let body = Buffer.concat(chunks)
      if (body.length && model) {
        const json = JSON.parse(body.toString('utf8'))
        json.model = model
        body = Buffer.from(JSON.stringify(json))
      }
      const target = base + req.url.replace(/^\/v1/, '')
      try {
        const upstream = await fetch(target, {
          method: req.method,
          headers: { 'content-type': 'application/json', authorization: `Bearer ${key}` },
          body: req.method === 'GET' ? undefined : body,
        })
        res.writeHead(upstream.status, {
          'content-type': upstream.headers.get('content-type') ?? 'application/json',
        })
        if (!upstream.body) return res.end()
        for await (const chunk of upstream.body) res.write(chunk)
        res.end()
        console.log(`${req.method} ${req.url} -> ${upstream.status}`)
      } catch (error) {
        console.log(`${req.method} ${req.url} -> error ${error.cause?.code ?? error.message}`)
        res.writeHead(502, { 'content-type': 'application/json' })
        res.end(JSON.stringify({ error: { message: `Clé unreachable: ${error.cause?.code ?? error.message}` } }))
      }
    }

    http
      .createServer((req, res) => {
        if (req.url === '/healthz') return res.end('ok')
        if (req.url.startsWith('/computeMetadata')) return metadata(req, res)
        if (req.url.startsWith('/v1/')) return void forward(req, res)
        res.writeHead(404).end()
      })
      .listen(8080, () => console.log('cle-gateway on :8080'))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cle-gateway
  namespace: bayes-platform
  labels:
    app: cle-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cle-gateway
  template:
    metadata:
      labels:
        app: cle-gateway
    spec:
      nodeSelector:
        workload: bayes
      # cle.charite.de resolves to the cle-relay Service (see cle-relay.yaml),
      # so TLS still terminates at Clé itself. Update if that Service changes.
      hostAliases:
        - ip: 10.240.18.254
          hostnames: ["cle.charite.de"]
      containers:
        - name: gateway
          image: node:24-slim
          command: ["node", "/srv/server.mjs"]
          env:
            - name: CLE_BASE_URL
              valueFrom: { configMapKeyRef: { name: cle-gateway, key: CLE_BASE_URL } }
            - name: CLE_MODEL
              valueFrom: { configMapKeyRef: { name: cle-gateway, key: CLE_MODEL } }
            - name: CLE_API_KEY
              valueFrom: { secretKeyRef: { name: cle-api, key: CLE_API_KEY } }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          volumeMounts:
            - name: code
              mountPath: /srv
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: code
          configMap:
            name: cle-gateway
            items: [{ key: server.mjs, path: server.mjs }]
---
apiVersion: v1
kind: Service
metadata:
  name: cle-gateway
  namespace: bayes-platform
spec:
  selector:
    app: cle-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
