# Helm post-renderer: pins every BayesPlatform workload (including the
# migration hook Job) to the dedicated bayes-node. The chart only exposes a
# nodeSelector for the API and the CPU workers, and the app image is too large
# for the 19 GB disks of the wearables nodes.
resources:
  - all.yaml
patches:
  - target:
      kind: (Deployment|StatefulSet|Job)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          workload: bayes
  # The OIDC issuer is http://localhost:8180 (port-forward); this sidecar makes
  # the same URL work from inside the API pod.
  - target:
      kind: Deployment
      name: bayes-platform-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: keycloak-proxy
          image: alpine/socat:1.8.0.3
          args: ["TCP-LISTEN:8180,fork,reuseaddr", "TCP:keycloak.bayes-platform.svc.cluster.local:8080"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
