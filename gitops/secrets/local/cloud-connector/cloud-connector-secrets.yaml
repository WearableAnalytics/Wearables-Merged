# Dev Secret: local minikube only, not secret. Production: gitops/secrets/prod.
# App JWT Secret, the same value as in wearables-bff-secrets. The provider keys
# (GARMIN_CLIENT_ID/SECRET, POLAR_..., ...) are optional and not set locally:
# OAuth callbacks need a public HTTPS URL.
apiVersion: v1
kind: Secret
metadata:
  name: cloud-connector-secrets
  namespace: cloud-connector
type: Opaque
stringData:
  JWT_SECRET: local-dev-app-jwt-secret-not-for-production
