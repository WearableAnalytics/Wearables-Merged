# Dev Secret: local minikube only, not secret. Production: gitops/secrets/prod.
# Postgres only reads POSTGRES_PASSWORD on the first start (empty volume).
apiVersion: v1
kind: Secret
metadata:
  name: prod-postgres-secret
  namespace: prod-postgres
  annotations:
    # Older versions of the prod-postgres chart created this secret; keeps a
    # helm upgrade of such a release from deleting it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
