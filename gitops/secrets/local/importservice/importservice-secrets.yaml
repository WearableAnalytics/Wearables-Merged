# Dev Secret: local minikube only, not secret. Production: gitops/secrets/prod.
# App JWT Secret, the same value as in wearables-bff-secrets (the BFF issues the case tokens).
apiVersion: v1
kind: Secret
metadata:
  name: importservice-secrets
  namespace: importservice
type: Opaque
stringData:
  JWT_SECRET: local-dev-app-jwt-secret-not-for-production
