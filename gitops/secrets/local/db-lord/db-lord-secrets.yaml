# Dev Secret: local minikube only, not secret. Production: gitops/secrets/prod.
# Matches the local Postgres (prod-postgres values-local.yaml) and InfluxDB
# (influxdb values-local.yaml). The tokens must be distinct; the same values are
# in wearables-bff-secrets and extraction-service-secrets (Shared Values).
apiVersion: v1
kind: Secret
metadata:
  name: db-lord-secrets
  namespace: db-lord
type: Opaque
stringData:
  POSTGRES_SERVER: prod-postgres.prod-postgres.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: dblord
  POSTGRES_USER: dblord
  POSTGRES_PASSWORD: dblord
  INFLUX_URL: http://influxdb-service.influx.svc.cluster.local:8086
  INFLUX_ORG: wearables-project
  INFLUX_BUCKET: measurements
  INFLUX_TOKEN: dev-influx-token
  CONTROL_WRITE_TOKEN: local-dev-control-write-token-not-for-production
  API_TOKEN_SERVICE_TOKEN: local-dev-api-token-service-token-not-for-production
  LEGACY_OPERATOR_TOKEN: local-dev-legacy-operator-token-not-for-production
  CONTROL_BOOTSTRAP_ADMIN_EMAILS: admin@example.com
