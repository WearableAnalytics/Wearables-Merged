# Dev Secret: local minikube only, not secret. Production: gitops/secrets/prod.
# JWT_SECRET is the App JWT Secret: the same value is in importservice-secrets,
# cloud-connector-secrets and grafana-auth-secrets. The tokens match db-lord-secrets
# (DATABASE_OPERATOR_TOKEN = db-lord's LEGACY_OPERATOR_TOKEN). No Brevo key:
# locally no mails are sent.
apiVersion: v1
kind: Secret
metadata:
  name: wearables-bff-secrets
  namespace: wearables-bff
  annotations:
    # Older versions of the wearables-bff chart created this secret; keeps a
    # helm upgrade of such a release from deleting it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: local-dev-app-jwt-secret-not-for-production
  BREVO_API_KEY: disabled
  CONTROL_WRITE_TOKEN: local-dev-control-write-token-not-for-production
  API_TOKEN_SERVICE_TOKEN: local-dev-api-token-service-token-not-for-production
  DATABASE_OPERATOR_TOKEN: local-dev-legacy-operator-token-not-for-production
