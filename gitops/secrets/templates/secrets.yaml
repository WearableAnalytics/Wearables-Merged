{{- /*
Renders every manifest under <environment>/<namespace>/<name>.yaml unchanged:
SealedSecrets (kubeseal output) in prod/, plain Dev Secrets in local/.
*/}}
{{- $environment := required "environment is required (prod or local)" .Values.environment }}
{{- range $path, $_ := .Files.Glob (printf "%s/**.yaml" $environment) }}
---
# Source: {{ $path }}
{{ $.Files.Get $path }}
{{- end }}
