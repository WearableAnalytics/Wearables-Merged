name: wearables_app_tub
description: "Flutter health monitoring app"
publish_to: 'none'

version: 2.1.0+5

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  health: ^13.2.0
  background_fetch: ^1.5.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.1.2
  mobile_scanner: ^5.1.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  flutter_svg: ^2.3.0
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
