[project]
name = "llm-worker"
version = "0.1.0"
description = "Consumes suspicious events from PostgreSQL and runs the semantic filter / explain pipeline on them"
readme = "README.md"
# lotus-ai 1.2.4 needs Python<3.13, numpy<2, pandas<3 (plan §3: the whole stack stays on 3.12)
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.2",
  "pydantic>=2.7",
  "pyyaml>=6",
  "lotus-ai==1.2.4",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<26",  # pyarrow 26 needs NumPy 2 at import time (not declared in its metadata)
  # direct dependency only so [tool.uv.sources] can point Linux at the CPU-only wheel index (no CUDA in the image)
  "torch>=2.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.6",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_worker"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Docker for a throwaway PostgreSQL",
  "ollama: needs a local Ollama (WORKER_LLM_BASE_URL); run with -m ollama",
]
addopts = "-m 'not ollama'"
filterwarnings = ["ignore:No pricing information available", "ignore::DeprecationWarning:litellm.*"]
