[project]
name = "llm-worker"
version = "0.1.0"
description = "Consumes suspicious events from PostgreSQL and runs the semantic filter / explain pipeline on them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_worker"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker for a throwaway PostgreSQL"]
