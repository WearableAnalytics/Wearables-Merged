services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: worker
      POSTGRES_PASSWORD: worker
      POSTGRES_DB: worker
    ports:
      - "127.0.0.1:${WORKER_PG_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worker -d worker"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["python", "-m", "llm_worker", "migrate"]
    environment:
      WORKER_DSN: postgresql://worker:worker@postgres:5432/worker
    depends_on:
      postgres:
        condition: service_healthy

  # Stand-in for the model (OpenAI-compatible): lets everyone run the worker without Ollama or cluster access.
  fake-llm:
    build: .
    command: ["python", "-m", "llm_worker", "fake-llm", "--port", "8080"]

  worker:
    build: .
    environment:
      WORKER_DSN: postgresql://worker:worker@postgres:5432/worker
      # default: the fake model. Local Ollama: WORKER_LLM_BASE_URL=http://host.docker.internal:11434/v1
      # WORKER_LLM_MODEL=qwen2.5:7b. Cluster: the Ollama / vLLM service URL and its model tag.
      WORKER_LLM_BASE_URL: ${WORKER_LLM_BASE_URL:-http://fake-llm:8080/v1}
      WORKER_LLM_MODEL: ${WORKER_LLM_MODEL:-fake-small}
      WORKER_LLM_API_KEY: ${WORKER_LLM_API_KEY:-unused}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-8}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      fake-llm:
        condition: service_started
    stop_grace_period: 60s
