services:
  web:
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
      args:
        # API endpoint baked into the frontend bundle at build time.
        # Override via an .env next to this file: VITE_API_BASE_URL=http://localhost:3001/api
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    restart: unless-stopped
