upstream api_backend {
  server wearables-bff.wearables-bff.svc.cluster.local:3001;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 1m;
  }

  # Prevent SPA fallback for Grafana proxy paths when upstream routing is missing.
  location ^~ /grafana/ {
    default_type text/plain;
    return 502 "Grafana proxy route is not configured.\n";
  }

  location ^~ /grafana-proxy/ {
    default_type text/plain;
    return 502 "Grafana proxy route is not configured.\n";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
