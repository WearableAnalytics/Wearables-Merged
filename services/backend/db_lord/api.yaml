swagger: "2.0"
info:
  title: Database Management API
  description: Database Management API
  version: 1.0.0
host: www
schemes:
  - https
paths:
  /patients:
    post:
      tags:
        - Patients
      summary: Stores a patient in the Relational Database
      description: Stores a freshly created patient in our database
      operationId: create_patient
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/PatientPost'
      responses:
        201:
          description: Patient created
          schema:
            $ref: '#/definitions/Patient'
    get:
      tags:
        - Patients
      summary: Retrieve all patients that fulfill a certain query
      produces:
        - application/json
      parameters:
        - in: query
          name: lastname
          required: false
          type: string
        - in: query
          name: firstname
          required: false
          type: string
        - in: query
          name: sex
          required: false
          type: string
          enum:
            - "female"
            - "male"
            - "other"
        - in: query
          name: birthRangeStart
          required: false
          type: string
          format: date
          description: "Start date of birth range (must be <= birthRangeEnd)"
        - in: query
          name: birthRangeEnd
          required: false
          type: string
          format: date
          description: "End date of birth range (must be >= birthRangeStart)"
        - in: query
          name: weightRangeStart
          required: false
          type: number
          minimum: 0
          description: "Minimum weight (must be <= weightRangeEnd)"
        - in: query
          name: weightRangeEnd
          required: false
          type: number
          minimum: 0
          description: "Maximum weight (must be >= weightRangeStart)"
      responses:
        200:
          description: List of Patients that fullfill the query
          schema:
            $ref: '#/definitions/PatientList'

  /patients/{patientId}:
    get:
      tags:
        - Patients
      summary: Get all information of a specfic patient
      produces:
        - application/json
      responses:
        200:
          description: Returns all information about the patient
          schema:
            $ref: '#/definitions/Patient'
    put:
      tags:
        - Patients
      summary: Overwrites an already existing Patient
      consumes:
        - application/json
      parameters:
        - in: path
          name: patientId
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/PatientPost'
      responses:
        204:
          description: Overwriting of the resource succeeded
        201:
          description: Resources was freshly created
    delete:
      tags:
        - Patients
      summary: Deletes a Patient in the Database
      parameters:
        - in: path
          name: patientId
          required: true
          type: string
      responses:
        204:
          description: Resource deleted

  /patients/{patientId}/wearables:
    get:
      tags:
        - Patients
      summary: Retrieve all wearable devices used by a patient
      produces:
        - application/json
      parameters:
        - in: path
          name: patientId
          required: true
          type: string
        - in: query
          name: manufacturer
          required: false
          type: string
          description: "Name of the Manufacturer of the Wearable"
        - in: query
          name: name
          required: false
          type: string
          description: "Concrete Name (e.g. Apple Watch Series 10 (GPS + Cellular))"
        - in: query
          name: osVersion
          required: false
          type: string
          description: "Version of the Wearables' Firmware: 26.0"
        - in: query
          name: serialNumber
          required: false
          type: string
        - in: query
          name: from
          required: false
          type: integer
          format: int64
          description: "Unix Timestamp of start time"
        - in: query
          name: to
          required: false
          type: integer
          format: int64
          description: "Unix Timestamp of end time"
      responses:
        200:
          description: List of Wearables used by the Patient
          schema:
            $ref: '#/definitions/PatientWearables'

  /patients/{patientId}/devices:
    get:
      tags:
        - Patients
      summary: Retrieve all devices used by a patient
      produces:
        - application/json
      parameters:
        - in: path
          name: patientId
          required: true
          type: string
        - in: query
          name: manufacturer
          required: false
          type: string
        - in: query
          name: name
          required: false
          type: string
        - in: query
          name: osVersion
          required: false
          type: string
        - in: query
          name: serialNumber
          required: false
          type: string
        - in: query
          name: from
          required: false
          type: integer
          format: int64
          description: "Unix Timestamp of start time"
        - in: query
          name: to
          required: false
          type: integer
          format: int64
          description: "Unix Timestamp of end time"
      responses:
        200:
          description: List of Devices used by Patient
          schema:
            $ref: '#/definitions/PatientDevices'
  
  /patients/{patientId}/contexts:
    get:
      tags:
        - Patients
      summary: Retrieve all context in which a Patient participated
      produces:
        - application/json
      parameters:
        - in: path
          name: patientId
          required: true
          type: string
        - in: query
          name: coordinator
          required: false
          type: string
        - in: query
          name: groupName
          required: false
          type: string
      responses:
        200:
          description: List of contexts in which the Patient participated
          schema:
            $ref: '#/definitions/PatientContexts'

  /patients/{patientId}/cases:
    get:
      tags:
        - Patients
      summary: Retrieve all Cases of a Patient
      produces:
        - application/json
      parameters:
        - in: path
          name: patientId
          required: true
          type: string
        - in: query
          name: status
          required: false
          type: string
      responses:
        200:
          description: List of Cases in which the Patient had
          schema:
            $ref: '#/definitions/PatientCases'

  /patients/{patientId}/measurements:
    get:
      tags:
        - Patients
      summary: Retrieve measurements for a patient
      produces:
        - application/json
      parameters:
        - in: path
          name: patientId
          required: true
          type: string
        - in: query
          name: signal
          required: false
          type: string
          description: "Type of Measurement (e.g. spo2)"
        - in: query
          name: from
          required: false
          type: integer
          format: int64
          description: "Unix Timestamp of start of time period"
        - in: query
          name: to
          required: false
          type: integer
          format: int64
          description: "Unix Timestamp of end of time period"
        - in: query
          name: appVersion
          required: false
          type: string
        - in: query
          name: caseId
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
          description: "List of cases that shall be included"
      responses:
        200:
          description: List of Measurements of that Patient
          schema:
            $ref: '#/definitions/PatientMeasurements'

  /wearables:
    post:
      tags:
        - Wearables
      summary: Creates a new Wearable-Device in the Database
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/WearablePost'
      responses:
        201:
          description: Wearable device created
          schema:
            $ref: '#/definitions/Wearable'

  /wearables/{wearableID}:
    get:
      tags:
        - Wearables
      summary: Returns all information about a device based on the ID
      produces:
        - application/json
      parameters:
        - in: path
          name: wearableID
          required: true
          type: string
      responses:
        200:
          description: Successfully retrieved measurements
          schema:
            $ref: '#/definitions/Wearable'
    put:
      tags:
        - Wearables
      summary: Update an Wearable in our Database
      consumes:
        - application/json
      parameters:
        - in: path
          name: wearableID
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/WearablePost'
      responses:
        204:
          description: Overwritten the wearable device
    delete:
      tags:
        - Wearables
      summary: Delete an Wearable in our Database
      parameters:
        - in: path
          name: wearableID
          required: true
          type: string
      responses:
        204:
          description: Successfully deleted resource

  /devices:
    post:
      tags:
        - Devices
      summary: Create a new Smartphone in our Database
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/DevicePost'
      responses:
        201:
          description: Successfully created resource in Database
          schema:
            $ref: '#/definitions/Device'

  /devices/{deviceID}:
    get:
      tags:
        - Devices
      summary: Retrieve all Data stored for a Device-ID
      produces:
        - application/json
      parameters:
        - in: path
          name: deviceID
          required: true
          type: string
      responses:
        200:
          description: All information stored for that Device-ID
          schema:
            $ref: '#/definitions/Device'
    put:
      tags:
        - Devices
      summary: Overwrite existing resource
      consumes:
        - application/json
      parameters:
        - in: path
          name: deviceID
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/DevicePost'
      responses:
        201:
          description: Created new resource
        204:
          description: Overwrite successful
    delete:
      tags:
        - Devices
      summary: Delete existing resource in our Database
      parameters:
        - in: path
          name: deviceID
          required: true
          type: string
      responses:
        204:
          description: Deleted successfully

  /contexts:
    post:
      tags:
        - Contexts
      summary: Create a new context in the Database
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextPost'
      responses:
        201:
          description: Successfully create new context-resource
          schema:
            $ref: '#/definitions/Context'

  /contexts/{contextID}:
    get:
      tags:
        - Contexts
      summary: Retrieve all information for a specific context-ID
      produces:
        - application/json
      parameters:
        - in: path
          name: contextID
          required: true
          type: string
      responses:
        200:
          description: All informations for a context-id
          schema:
            $ref: '#/definitions/Context'
    put:
      tags:
        - Contexts
      summary: Overwrites a resource
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: path
          name: contextID
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextPost'
      responses: 
        201:
          description: Created resource under given key
          schema:
            $ref: '#/definitions/Context'
        204:
          description: Overwritten resource
    delete:
      tags:
        - Contexts
      summary: Deletes a resource
      parameters:
        - in: path
          name: contextID
          required: true
          type: string
      responses:
        204:
          description: Successfully deleted resource

  /cases:
    post:
      tags:
        - Cases
      summary: Create a new Case which combines all of the other resources
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CasePost'
      responses:
        201:
          description: Successfully create case in database
          schema:
            $ref: '#/definitions/Case'
  /cases/{caseId}:
    get:
      tags:
        - Cases
      summary: Retrieve all data stored for a case
      produces:
        - application/json
      parameters:
        - in: path
          name: caseId
          required: true
          type: string
      responses:
        200:
          description: All informations about a single case
          schema:
            $ref: '#/definitions/Case'
    put:
      tags:
        - Cases
      summary: Overwrite an already existing resource
      consumes:
        - application/json
      parameters:
        - in: path
          name: caseId
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CasePost'
      responses:
        201:
          description: Created new resource
        204:
          description: Updated existing resource
    delete:
      tags:
        - Cases
      summary: Delete an already existing resource
      parameters:
        - in: path
          name: caseId
          required: true
          type: string
      responses:
        204:
          description: Deleted existing resource

definitions:
  PatientBase:
    type: object
    properties:
      chariteId:
        type: string
        description: "Charité internal representation of the Patient"
        example: "8374267sih234"
      lastName:
        type: string
        description: "Lastname of the Patient"
        example: "Pork"
      firstName:
        type: string
        description: "Firstname of the Patient"
        example: "Joana"
      sex:
        type: string
        enum:
          - "female"
          - "male"
          - "other"
        description: "Sex of the Patient"
        example: "female"
      birthDate:
        type: string
        format: date
        description: "Birth-Date of the Patient (can be used to calculate age)"
      weight:
        type: number
        description: "Weight of the Patient"
    required:
      - chariteId
      - lastName
      - firstName
      - sex
      - birthDate
      - weight

  PatientPost:
    allOf:
      - $ref: '#/definitions/PatientBase'

  Patient:
    allOf:
      - $ref: '#/definitions/PatientBase'
      - type: object
        properties:
          patientId:
            type: string
            description: Unique patient identifier
            example: "id-1234"
        required:
          - patientId

  PatientList:
    type: object
    properties:
      patients:
        type: array
        items:
          $ref: '#/definitions/Patient'
    required:
      - patients
  
  PatientMeasurements:
    type: object
    properties:
      measurements:
        type: array
        items:
          $ref: '#/definitions/Measurement'
    required:
      - measurements

  Measurement:
    type: object
    properties: 
      timestamp:
        type: integer
        format: int64
        description: "Unix Timestamp pf the measurement"
      measurement:
        type: string
        description: "Measurement series name (e.g. heart-rate)"
        example: "heart-rate"
      tags:
        type: object
        properties:
          patientId:
            type: string
          caseId:
            type: string
          deviceId:
            type: string
          wearableId:
            type: string
          contextId:
            type: string
        additionalProperties:
          type: string
          description: "Optional additional tags (unit, location, ...)"
      signal:
        $ref: '#/definitions/Signal'
    required:
      - timestamp
      - measurement
      - tags
      - signal

  Signal:
    type: object
    properties:
      type:
        type: string
        example: "heart-rate"
      value:
        type: number
        example: 50
      unit:
        type: string
        example: "bpm"
    required:
      - type
      - value
      - unit

  Wearable:
    type: object
    properties:
      wearableId:
        type: string
        description: Unique identifier for the device in our system
        example: "APL7984563592432saf1342"
      serialNumber:
        type: string
        description: Wearable serial number
        example: "XYXYY628348YAGFFSIJF0Y"
      osVersion:
        type: string
        description: Version of the Wearable Firmware
        example: "26.0"
      name:
        type: string
        description: Model-Name of the Wearable-Device
        example: "Apple Watch Series 10 (GPS + Cellular)"
      modelNumber:
        type: string
        description: Model-Number of the Wearable-Device
        example: "A3003"
      manufacturer:
        type: string
        description: Manufacturer of the Watch
        example: "Apple Inc."
    required:
      - wearableId
      - serialNumber
      - osVersion
      - name
      - modelNumber
      - manufacturer

  WearablePost:
    type: object
    properties:
      serialNumber:
        type: string
        description: Wearable serial number
        example: "XYXYY628348YAGFFSIJF0Y"
      osVersion:
        type: string
        description: Firmware-Version of the Wearable-Device
        example: "26.0"
      name:
        type: string
        description: Model-Name of the Wearable-Device
        example: "Apple Watch Series 10 (GPS + Cellular)"
      modelNumber:
        type: string
        description: Model-Number of the Wearable-Device
        example: "A3003"
      manufacturer:
        type: string
        description: Manufacturer of the Watch
        example: "Apple Inc."
    required:
      - serialNumber
      - osVersion
      - name
      - modelNumber
      - manufacturer

  PatientWearables:
    type: object
    properties:
      wearables:
        type: array
        items:
          $ref: '#/definitions/WearablePatient'
    required:
      - wearables

  WearablePatient:
    type: object
    properties:
      wearable:
        $ref: '#/definitions/Wearable'
        description: "Information about the Wearable-Device"
      timePeriod:
        $ref: '#/definitions/TimePeriod'
        description: "Time-Period in which the User had the Wearable-Device"
    required:
      - wearable
      - timePeriod
  
  TimePeriod:
    type: object
    properties:
      assignedFrom:
        type: integer
        format: int64
        description: "Unix Timestamp of the moment the device use in the case starts"
      assignedTo:
        type: integer
        format: int64
        description: "Unix Timestamp of the moment the device use in the case stops"


  DevicePost:
    type: object
    properties:
      serialNumber:
        type: string
        description: Serial-Number of the Smartphone
        example: "XYXYX929875TZRD0"
      osVersion:
        type: string
        description: Smartphone-OS Version
        example: "26.0"
      name:
        type: string
        description: Model-Name of the Smartphone
        example: "Apple iPhone 13 Pro Max"
      modelNumber:
        type: string
        description: Model-Number of the Smartphone
        example: "A3003"
      manufacturer:
        type: string
        description: Manufacturer of the Phone
        example: "Apple Inc."
    required:
      - serialNumber
      - osVersion
      - name
      - modelNumber
      - manufacturer

  Device:
    type: object
    properties:
      deviceId:
        type: string
        description: Unique identifier for the device in our Database
        example: "APL34897268isudgi17"
      serialNumber:
        type: string
        description: Serial-Number of the Smartphone
        example: "XYXYX929875TZRD0"
      osVersion:
        type: string
        description: Smartphone-OS Version
        example: "26.0"
      name:
        type: string
        description: Model-Name of the Smartphone
        example: "Apple iPhone 13 Pro Max"
      modelNumber:
        type: string
        description: Model-Number of the Smartphone
        example: "A3003"
      manufacturer:
        type: string
        description: Manufacturer of the Phone
        example: "Apple Inc."
    required:
      - deviceId
      - serialNumber
      - osVersion
      - name
      - modelNumber
      - manufacturer

  PatientDevice:
    type: object
    properties:
      device:
        $ref: '#/definitions/Device'
      timePeriod:
        $ref: '#/definitions/TimePeriod'
    required:
      - device
      - timePeriod

  PatientDevices:
    type: object
    properties:
      devices:
        type: array
        items:
          $ref: '#/definitions/PatientDevice'
    required:
      - devices

  ContextPost:
    type: object
    properties:
      groupName:
        type: string
        description: Name of the Group in the context
        example: "Placebo-Group-1234"
      coordinator:
        type: string
        description: Identifier of the Coordinator of the Context
        example: "D445"
    required:
      - coordinator

  Context:
    type: object
    properties:
      contextId:
        type: string
        description: Unique identifier of the specific context in our system
        example: "ijsdha1345787934625s"
      groupName:
        type: string
        description: Name of the Group in the context
        example: "Placebo-Group-1234"
      coordinator:
        type: string
        description: Identifier of the Coordinator of the Context (usually the doctor)
        example: "D445"
    required:
      - contextId
      - coordinator

  PatientContexts:
    type: object
    properties:
      contexts:
        type: array
        items:
          $ref: '#/definitions/Context'
    required:
      - contexts

  Case:
    type: object
    properties:
      caseId:
        type: string
        description: Unique identifier of the case
        example: "083z45"
      status:
        type: string
        description: "currently not defined"
        example: "Status-Code 1"
      patientId:
        type: string
        description: "patient that has this case"
        example: "id-1234"
      devices:
        type: array
        items:
          $ref: '#/definitions/CaseDevice'
        description: "Referencing the Device to the Case"
      wearables:
        type: array
        items:
          $ref: '#/definitions/CaseWearable'
        description: "Referencing the Wearbale to the Case"
      contexts:
        type: array
        items:
          type: string
        description: "reference of the context in which the case happens"
        example: "ijsdha1345787934625s"
    required:
      - caseId
      - status
      - patientId
      - wearables
      - devices
      - contexts

  CasePost:
    type: object
    properties:
      status:
        type: string
        description: "currently not defined"
        example: "Status-Code 1"
      patientId:
        type: string
        description: "patient that has this case"
        example: "id-1234"
      devices:
        type: array
        items:
          $ref: '#/definitions/CaseDevice'
        description: "Referencing the Device to the Case"
      wearables:
        type: array
        items:
          $ref: '#/definitions/CaseWearable'
        description: "Referencing the Wearable to the Case"
      contexts:
        type: array
        items:
          type: string
          example: "ijsdha1345787934625s"
        description: "reference of the context in which the case happens"
    required:
      - status
      - patientId
      - wearables
      - devices
      - contexts

  PatientCases:
    type: object
    properties:
      Cases:
        type: array
        items:
          $ref: '#/definitions/Case'
    required:
      - Cases

  CaseDevice:
    type: object
    properties:
      deviceId:
        type: string
        description: "reference of the smartphone used in the case"
        example: "APL34897268isudgi17"
      assignedFrom:
        type: integer
        format: int64
        description: "Unix Timestamp of the moment the device use in the case starts"
      assignedTo:
        type: integer
        format: int64
        description: "Unix Timestamp of the moment the device use in the case stops"
    required:
      - deviceId
      - assignedFrom

  CaseWearable:
    type: object
    properties:
      wearableId:
        type: string
        description: "reference of the wearable device used in the case"
        example: "APL7984563592432saf1342"
      assignedFrom:
        type: integer
        format: int64
        description: "Unix timestamp from which the wearable use in the case starts"
      assignedTo:
        type: integer
        format: int64
        description: "Unix Timestamp from which the wearbale use in the case stops"
    required:
      - wearableId
      - assignedFrom

  Error:
    type: object
    properties:
      code:
        type: integer
      message:
        type: string
      details:
        type: string
    required:
      - code
      - message

tags:
  - name: Patients
    description: Patient management endpoints
  - name: Wearables
    description: Wearable management endpoints
  - name: Devices
    description: Smartphone management endpoints
  - name: Contexts
    description: Context management endpoints
  - name: Cases
    description: Case management endpoints