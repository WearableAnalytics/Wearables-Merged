[agent]
  flush_interval = "1s"
  omit_hostname = true
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["wearables-lp"]
  consumer_group = "ingestion-test"
  version = "3.6.0"
  offset = "oldest"
  data_format = "influx"
[[outputs.influxdb_v2]]
  urls = ["http://influx:8086"]
  token = "${INGEST_TEST_INFLUX_TOKEN}"
  organization = "wearables_test"
  bucket = "ingestion_test"
[[processors.starlark]]
  source = '''
load("time.star", "time")
def apply(metric):
  metric.fields["t_ingested"] = time.now().unix_nano
  ref = metric.tags.get("device-id-reference")
  if "device-id" not in metric.tags and ref and ref.startswith("Patient/"):
    metric.tags["device-id"] = ref[len("Patient/"):]
  return metric
'''
