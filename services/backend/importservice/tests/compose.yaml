services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ingestion_test
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ${INGEST_TEST_DB_PASSWORD:?Set a local test password}
    ports: ["127.0.0.1:55459:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion -d ingestion_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  kafka:
    image: apache/kafka:4.1.0
    ports: ["127.0.0.1:59092:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
  influx:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ingestion-test
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INGEST_TEST_INFLUX_PASSWORD:?Set a local test password}
      DOCKER_INFLUXDB_INIT_ORG: wearables_test
      DOCKER_INFLUXDB_INIT_BUCKET: ingestion_test
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INGEST_TEST_INFLUX_TOKEN:?Set a local test token}
    ports: ["127.0.0.1:18199:8086"]
  telegraf:
    image: telegraf:1.36
    restart: unless-stopped
    volumes: ["./telegraf.conf:/etc/telegraf/telegraf.conf:ro"]
    environment:
      INGEST_TEST_INFLUX_TOKEN: ${INGEST_TEST_INFLUX_TOKEN:?Set a local test token}
