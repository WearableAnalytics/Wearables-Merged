[project]
name = "extraction-service"
version = "0.1.0"
description = "Researcher-facing extraction API that proxies/exports measurements from db_lord telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.24",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
  "line-protocol-parser>=1.1.3",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pyyaml>=6.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
fixable = ["ALL"]

[tool.pytest.ini_options]
pythonpath = ["."]
