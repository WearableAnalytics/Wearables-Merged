services:
  extraction:
    build: ..
    environment:
      DB_LORD_BASE_URL: http://db-lord:8080
      DB_LORD_OPERATOR_TOKEN: synthetic-demo
      METRICS_PORT: "9103"
    ports: ["127.0.0.1:18010:8010", "127.0.0.1:19103:9103"]
  db-lord:
    image: python:3.11-slim
    command: ["python", "/demo/db_lord.py"]
    volumes: ["./db_lord.py:/demo/db_lord.py:ro"]
  prometheus:
    image: prom/prometheus:v3.13.2
    volumes: ["./prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:19090:9090"]
  grafana:
    image: grafana/grafana:12.3.2
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/demo.yaml:ro
      - ./grafana-dashboard.yaml:/etc/grafana/provisioning/dashboards/demo.yaml:ro
      - ../../../../gitops/apps/monitoring/grafana/dashboards/wearables-export-monitoring.json:/var/lib/grafana-dashboards/export.json:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["127.0.0.1:13000:3000"]
