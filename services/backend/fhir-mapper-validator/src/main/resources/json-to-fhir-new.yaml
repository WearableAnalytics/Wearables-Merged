metadata:
  fields:
    - name: device
      source: deviceInfo.deviceId
      target: device.display
      optional: false
      type: string
measurement:
  paths:
    - path: measurements.instantaneous
      arrayMapAll: true
      fields:
        - name: fhirType
          value: "Observation"
          target: resourceType
          optional: false
          type: string
        - name: type
          mapping: true
          target: id
          optional: false
          type: string
        - name: value
          source: measurement.instantaneous.value
          target: valueQuantity.value
          optional: false
          type: real
        - name: unit
          source: measurement.instantaneous.unit
          target: valueQuantity.unit
          optional: false
          type: string
        - name: start
          source: measurement.instantaneous.timestamp
          target: effectiveDateTime
          append: "Z"
          optional: false
          type: string
        - name: status
          value: "final"
          target: status
          optional: false
          type: string
        - name: codingSystem
          mapping: true
          target: code.coding[0].system
          optional: false
          type: string
        - name: codingCode
          mapping: true
          target: code.coding[0].code
          optional: false
          type: string
        - name: codingDisplay
          source: measurement.instantaneous.unit
          target: code.coding[0].display
          optional: false
          type: string
      mappings:
        - path: code.coding[0].code
          basedOn: measurement.instantaneous.unit
          valueType: string
          map:
            - key: "COUNT"
              value: "55423-8"
            - key: "BEATS_PER_MINUTE"
              value: "8867-4"
            - key: "KILOCALORIE"
              value: "41981-2"
            - key: "PERCENT"
              value: "percent"
            - key: "MILLISECOND"
              value: "ms"
            - key: "METER"
              value: "m"
            - key: "MINUTE"
              value: "min"
            - key: "RESPIRATIONS_PER_MINUTE"
              value: "count"
        - path: code.coding[0].system
          basedOn: measurement.instantaneous.unit
          valueType: string
          map:
            - key: "METER"
              value: "metric"
            - key: "MILLISECOND"
              value: "time"
            - key: "MINUTE"
              value: "time"
            - key: "PERCENT"
              value: "metric"
            - key: "COUNT"
